<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Chrome Dino</title>
<meta name="description" content="chrome://dino 单文件复刻版：精灵图、音效与全部游戏常量均取自 Chromium 官方资源，桌面与手机均可游玩。">
<style>
/* =========================================================================
   Chrome Dino 复刻版 —— 样式
   视觉基调与 chrome://dino 错误页一致：纯白底、单一深灰前景色。
   夜间模式沿用官方做法：对根元素加 .inverted，用 filter 整体反色。
   ========================================================================= */

html.inverted {
  filter: invert(100%);
}

* {
  box-sizing: border-box;
}

html {
  height: 100%;
  margin: 0;
  overflow: hidden;
  /* 手机端禁止下拉刷新 / 整页橡皮筋 */
  overscroll-behavior: none;
}

body {
  /* 把 body 固定成「视口壳」：iOS Safari 上锁死页面，地址栏收起时也不会跳动，
     同时彻底消除整页拖拽。inset 在下面单独写，兼容老写法。 */
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #fff;
  color: #535353;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  user-select: none;
  -webkit-user-select: none;
}

/* 舞台：逻辑尺寸恒为 600x150，窄屏时由 JS 设置缩放 */
#fit {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  height: 150px;
  width: 100%;
  touch-action: none;
}

#stage {
  width: 600px;
  height: 150px;
  transform-origin: top center;
  touch-action: none;
}

/* 游戏容器：官方开场动画就是把它的宽度从 44px 展开到 600px */
.runner-container {
  position: relative;
  width: 600px;
  height: 150px;
  overflow: hidden;
  outline: none;
  touch-action: none;
}

.runner-container canvas {
  display: block;
  cursor: pointer;
  touch-action: none;
}

@keyframes intro {
  from {
    width: 44px;
  }
  to {
    width: 600px;
  }
}

.runner-container.intro {
  animation: intro 0.4s ease-out 1 both;
}

/* 操作提示：初次进入淡入，开始游戏后淡出（原版无此元素，仅作可达性补充）
   键盘版与触摸版二选一显示，由 JS 在 <body> 上打 .touch / .keyboard 决定 */
#hint {
  margin-top: 18px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: 16px;
  line-height: 16px;
  letter-spacing: 0.04em;
  color: #9a9a9a;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.35s ease;
  white-space: nowrap;
}

#hint.show {
  opacity: 1;
}

#hint kbd {
  display: inline-block;
  padding: 1px 5px;
  margin: 0 1px;
  border: 1px solid #d8d8d8;
  border-radius: 3px;
  background: #f6f6f6;
  color: #6b6b6b;
  font-family: inherit;
  font-size: 11px;
  line-height: 14px;
}

#hint .sep {
  margin: 0 8px;
  color: #d0d0d0;
}

/* 两套文案互斥显示：默认按键盘文案，检测到触屏后换成触摸文案 */
.hint-touch {
  display: none;
}

body.touch .hint-kb {
  display: none;
}

body.touch .hint-touch {
  display: inline;
}

/* 手机竖屏：提示字略小，避免换行 */
@media (max-width: 520px) {
  #hint {
    margin-top: 14px;
    font-size: 11px;
  }
}

/* 横屏矮屏（手机横放）：压缩上下留白，让游戏条尽量居中 */
@media (max-height: 420px) {
  #hint {
    margin-top: 10px;
  }
}

/* 游戏未就绪时隐藏画布，避免闪白 */
body:not(.ready) #stage {
  visibility: hidden;
}

</style>
</head>
<body>

<div id="fit">
  <div id="stage">
    <div class="runner-container" id="runner-container" role="application" tabindex="0"
         aria-label="Chrome 恐龙游戏" title="点击或按空格开始">
      <canvas id="runner-canvas" width="600" height="150"></canvas>
    </div>
  </div>
</div>

<div id="hint" role="note">
  <span class="hint-kb"><kbd>空格</kbd> / <kbd>↑</kbd> 跳跃 <span class="sep">·</span> <kbd>↓</kbd> 下蹲 <span class="sep">·</span> <kbd>Enter</kbd> 重开</span>
  <span class="hint-touch">轻触屏幕跳跃 · 按住跳更高 · 撞毁后轻触重开</span>
</div>

  /* =======================================================================
   * 1. 运行环境常量（constants.ts）
   * ===================================================================== */
  var FPS = 60;
  var IS_HIDPI = window.devicePixelRatio > 1;
  var NAV = window.navigator;
  var UA = NAV.userAgent;
  var MAX_TOUCH_POINTS = NAV.maxTouchPoints || 0;

  /**
   * 是否为触屏设备（用于决定是否走触摸输入与触摸版操作提示）。
   * 同时看 ontouchstart / maxTouchPoints / 指针精度，避免只靠 UA 漏判。
   */
  var HAS_TOUCH = ('ontouchstart' in window) || MAX_TOUCH_POINTS > 0 ||
    (typeof window.matchMedia === 'function' &&
      window.matchMedia('(pointer: coarse)').matches);

  /**
   * 移动端判定（constants.ts 的 IS_IOS / IS_MOBILE）。
   * 官方原实现只认 /Android/ 与 CriOS(iOS Chrome)，因为它只跑在 Chrome 里；
   * 本页要在任意手机浏览器打开，故补齐 iPhone/iPad Safari 与 iPadOS 的桌面型 UA
   * （iPadOS 13+ 报告为 "Macintosh"，只能靠多点触控数区分）。
   * IS_MOBILE 决定障碍物取 desktop 还是 mobile 高度表，属于玩法参数，必须判对。
   */
  var IS_IOS = /iPad|iPhone|iPod/.test(UA) || /CriOS|FxiOS/.test(UA) ||

      this.currentFrame = this.currentFrame === this.currentAnimFrames.length - 1 ?

    var sourceX = x;
    var sourceY = y;
    var sourceWidth = this.ducking && this.status !== STATUS.CRASHED ?
      this.config.widthDuck : this.config.width;
    var sourceHeight = this.config.height;
    var outputHeight = sourceHeight;
    var outputWidth = this.config.width;

    if (IS_HIDPI) {
      sourceX *= 2;
      sourceY *= 2;
      sourceWidth *= 2;
      sourceHeight *= 2;
    }

    sourceX += this.spritePos.x;
    sourceY += this.spritePos.y;

    if (this.flashing) {
      if (this.timer < this.config.flashOn) {
        this.ctx.globalAlpha = 0.5;
      } else if (this.timer > this.config.flashOff) {
        this.timer = 0;
      }
    }

    if (this.ducking && this.status !== STATUS.CRASHED) {
      this.ctx.drawImage(
        G.image, sourceX, sourceY, sourceWidth, sourceHeight,
        this.xPos, this.yPos, this.config.widthDuck, outputHeight);
    } else {
      // 下蹲时撞毁：恐龙站起，需要右移 1px 对齐
      if (this.ducking && this.status === STATUS.CRASHED) {
        this.xPos++;
      }
      this.ctx.drawImage(
        G.image, sourceX, sourceY, sourceWidth, sourceHeight,
        this.xPos, this.yPos, outputWidth, outputHeight);
    }
    this.ctx.globalAlpha = 1;
  };

  Trex.prototype.setBlinkDelay = function () {
    this.blinkDelay = Math.ceil(Math.random() * BLINK_TIMING);
  };

  Trex.prototype.blink = function (time) {
    var deltaTime = time - this.animStartTime;
    if (deltaTime >= this.blinkDelay) {
      this.draw(this.currentAnimFrames[this.currentFrame], 0);
      if (this.currentFrame === 1) {
        this.setBlinkDelay();
        this.animStartTime = time;
        this.blinkCount++;
      }
    }
  };

  Trex.prototype.startJump = function (speed) {
    if (!this.jumping) {
      this.update(0, STATUS.JUMPING);
      // 起跳速度随游戏速度微调
      this.jumpVelocity = this.config.initialJumpVelocity - (speed / 10);
      this.jumping = true;
      this.reachedMinHeight = false;
      this.speedDrop = false;
    }
  };

  Trex.prototype.endJump = function () {
    if (this.reachedMinHeight && this.jumpVelocity < this.config.dropVelocity) {
      this.jumpVelocity = this.config.dropVelocity;
    }
  };

  Trex.prototype.updateJump = function (deltaTime) {
    var msPerFrame = ANIM_FRAMES[this.status].msPerFrame;
    var framesElapsed = deltaTime / msPerFrame;

    if (this.speedDrop) {
      this.yPos += Math.round(
        this.jumpVelocity * this.config.speedDropCoefficient * framesElapsed);
    } else {
      this.yPos += Math.round(this.jumpVelocity * framesElapsed);
    }

    this.jumpVelocity += this.config.gravity * framesElapsed;

    if (this.yPos < this.minJumpHeight || this.speedDrop) {
      this.reachedMinHeight = true;
    }
    if (this.yPos < this.config.maxJumpHeight || this.speedDrop) {
      this.endJump();
    }

    if (this.yPos > this.groundYPos) {
      this.reset();
      this.jumpCount++;
    }
  };

  Trex.prototype.setSpeedDrop = function () {
    this.speedDrop = true;
    this.jumpVelocity = 1;
  };

  Trex.prototype.setDuck = function (isDucking) {
    if (isDucking && this.status !== STATUS.DUCKING) {
      this.update(0, STATUS.DUCKING);
      this.ducking = true;
    } else if (this.status === STATUS.DUCKING) {
      this.update(0, STATUS.RUNNING);
      this.ducking = false;
    }
  };

  Trex.prototype.reset = function () {
    this.xPos = this.xInitialPos;
    this.yPos = this.groundYPos;
    this.jumpVelocity = 0;
    this.jumping = false;
    this.ducking = false;
    this.update(0, STATUS.RUNNING);
    this.speedDrop = false;
    this.jumpCount = 0;
  };

  Trex.prototype.getCollisionBoxes = function () {
    return this.ducking ? TREX_COLLISION_BOXES.ducking : TREX_COLLISION_BOXES.running;
  };

  Trex.prototype.setFlashing = function (status) { this.flashing = status; };

  /* =======================================================================
   * 10. 分数显示（distance_meter.ts）
   * ===================================================================== */
  var DM_CONFIG = {
    MAX_DISTANCE_UNITS: 5,
    ACHIEVEMENT_DISTANCE: 100,
    COEFFICIENT: 0.025,
    FLASH_DURATION: 1000 / 4,
    FLASH_ITERATIONS: 3,
    HIGH_SCORE_HIT_AREA_PADDING: 4
  };

  function DistanceMeter(canvas, spritePos_, canvasWidth) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.spritePos = spritePos_;
    this.canvasWidth = canvasWidth;
    this.x = 0;
    this.y = 5;
    this.maxScore = 0;
    this.highScore = '0';
    this.digits = [];
    this.defaultString = '';
    this.flashTimer = 0;
    this.flashIterations = 0;
    this.flashingRafId = null;
    this.highScoreBounds = null;
    this.highScoreFlashing = false;
    this.maxScoreUnits = DM_CONFIG.MAX_DISTANCE_UNITS;
    this.frameTimeStamp = 0;
    this.achievement = false;
    this.init(canvasWidth);
  }

  DistanceMeter.prototype.init = function (width) {
    var maxDistanceStr = '';
    this.calcXpos(width);
    this.maxScore = this.maxScoreUnits;
    for (var i = 0; i < this.maxScoreUnits; i++) {
      this.draw(i, 0);
      this.defaultString += '0';
      maxDistanceStr += '9';
    }
    this.maxScore = parseInt(maxDistanceStr, 10);
  };

  DistanceMeter.prototype.calcXpos = function (canvasWidth) {
    this.x = canvasWidth - (DM_DIM.DEST_WIDTH * (this.maxScoreUnits + 1));
  };

  DistanceMeter.prototype.draw = function (digitPos, value, highScore) {
    var sourceWidth = DM_DIM.WIDTH;
    var sourceHeight = DM_DIM.HEIGHT;
    var sourceX = DM_DIM.WIDTH * value;
    var sourceY = 0;

    var targetX = digitPos * DM_DIM.DEST_WIDTH;
    var targetY = this.y;
    var targetWidth = DM_DIM.WIDTH;
    var targetHeight = DM_DIM.HEIGHT;

    if (IS_HIDPI) {
      sourceWidth *= 2;
      sourceHeight *= 2;
      sourceX *= 2;
    }

    sourceX += this.spritePos.x;
    sourceY += this.spritePos.y;

    this.ctx.save();
    var highScoreX = this.x - (this.maxScoreUnits * 2) * DM_DIM.WIDTH;
    this.ctx.translate(highScore ? highScoreX : this.x, this.y);
    this.ctx.drawImage(
      G.image, sourceX, sourceY, sourceWidth, sourceHeight,
      targetX, targetY, targetWidth, targetHeight);
    this.ctx.restore();
  };

  DistanceMeter.prototype.getActualDistance = function (distance) {
    return distance ? Math.round(distance * DM_CONFIG.COEFFICIENT) : 0;
  };

  DistanceMeter.prototype.update = function (deltaTime, distance) {
    var paint = true;
    var playSound = false;

    if (!this.achievement) {
      distance = this.getActualDistance(distance);
      if (distance > this.maxScore &&
        this.maxScoreUnits === DM_CONFIG.MAX_DISTANCE_UNITS) {
        this.maxScoreUnits++;
        this.maxScore = parseInt(this.maxScore + '9', 10);
      }

      if (distance > 0) {
        if (distance % DM_CONFIG.ACHIEVEMENT_DISTANCE === 0) {
          // 每 100 分：分数闪烁 + 提示音
          this.achievement = true;
          this.flashTimer = 0;
          playSound = true;
        }
        var distanceStr =
          (this.defaultString + distance).substr(-this.maxScoreUnits);
        this.digits = distanceStr.split('');
      } else {
        this.digits = this.defaultString.split('');
      }
    } else {
      if (this.flashIterations <= DM_CONFIG.FLASH_ITERATIONS) {
        this.flashTimer += deltaTime;
        if (this.flashTimer < DM_CONFIG.FLASH_DURATION) {
          paint = false;
        } else if (this.flashTimer > DM_CONFIG.FLASH_DURATION * 2) {
          this.flashTimer = 0;
          this.flashIterations++;
        }
      } else {
        this.achievement = false;
        this.flashIterations = 0;
        this.flashTimer = 0;
      }
    }

    if (paint) {
      for (var i = this.digits.length - 1; i >= 0; i--) {
        this.draw(i, parseInt(this.digits[i], 10));
      }
    }

    this.drawHighScore();
    return playSound;
  };

  DistanceMeter.prototype.drawHighScore = function () {
    if (this.highScore.length > 0) {
      this.ctx.save();
      this.ctx.globalAlpha = 0.8;
      for (var i = this.highScore.length - 1; i >= 0; i--) {
        var ch = this.highScore[i];
        var spriteIndex = parseInt(ch, 10);
        if (isNaN(spriteIndex)) {
          if (ch === 'H') { spriteIndex = 10; }
          else if (ch === 'I') { spriteIndex = 11; }
          else { continue; }
        }
        this.draw(i, spriteIndex, true);
      }
      this.ctx.restore();
    }
  };

  DistanceMeter.prototype.setHighScore = function (distance) {
    distance = this.getActualDistance(distance);
    var highScoreStr =
      (this.defaultString + distance).substr(-this.maxScoreUnits);
    this.highScore = 'HI ' + highScoreStr;
  };

  /**
   * 重置分数显示（官方 reset()：仅重绘 "00000"，历史高分保留）
   */
  DistanceMeter.prototype.reset = function () {
    this.update(0, 0);
    this.achievement = false;
  };

  DistanceMeter.prototype.resetHighScore = function () {
    this.setHighScore(0);
    this.cancelHighScoreFlashing();
  };

  DistanceMeter.prototype.getHighScoreBounds = function () {
    return {
      x: (this.x - (this.maxScoreUnits * 2) * DM_DIM.WIDTH) -
        DM_CONFIG.HIGH_SCORE_HIT_AREA_PADDING,
      y: this.y,
      width: DM_DIM.WIDTH * (this.highScore.length + 1) +
        DM_CONFIG.HIGH_SCORE_HIT_AREA_PADDING,
      height: DM_DIM.HEIGHT + (DM_CONFIG.HIGH_SCORE_HIT_AREA_PADDING * 2)
    };
  };

  /**
   * 点击是否落在 "HI xxxxx" 高分区域。
   *
   * 坐标一律用 clientX/clientY 换算，而不用 offsetX：
   * 窄屏手机上 #stage 被整体 CSS 缩放到 600 的若干分之一，此时窗口坐标必须除以同一个
   * 缩放系数才能还原成画布逻辑坐标；offsetX 在缩放元素上的行为各浏览器不一致。
   */
  DistanceMeter.prototype.hasClickedOnHighScore = function (e) {
    var cx = null;
    var cy = null;
    var isTouch = typeof TouchEvent !== 'undefined' && e instanceof TouchEvent;

    if (isTouch) {
      // touchend 时 touches 已空，要退回 changedTouches
      var t = (e.touches && e.touches.length) ? e.touches[0] :
        (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0] : null;
      if (!t) { return false; }
      cx = t.clientX;
      cy = t.clientY;
    } else if (typeof MouseEvent !== 'undefined' && e instanceof MouseEvent) {
      cx = e.clientX;
      cy = e.clientY;
    } else {
      return false;
    }

    var bounds = this.canvas.getBoundingClientRect();
    var scale = (this.canvasWidth && bounds.width) ? bounds.width / this.canvasWidth : 1;
    if (!scale) { scale = 1; }
    var x = (cx - bounds.left) / scale;
    var y = (cy - bounds.top) / scale;

    this.highScoreBounds = this.getHighScoreBounds();
    return x >= this.highScoreBounds.x &&
      x <= this.highScoreBounds.x + this.highScoreBounds.width &&
      y >= this.highScoreBounds.y &&
      y <= this.highScoreBounds.y + this.highScoreBounds.height;
  };

  DistanceMeter.prototype.clearHighScoreBounds = function () {
    if (this.highScoreBounds) {
      this.ctx.clearRect(
        this.highScoreBounds.x, this.highScoreBounds.y,
        this.highScoreBounds.width, this.highScoreBounds.height);
    }
  };

  DistanceMeter.prototype.flashHighScore = function () {
    var self = this;
    var now = getTimeStamp();
    var deltaTime = now - (this.frameTimeStamp || now);
    var paint = true;
    this.frameTimeStamp = now;

    if (this.flashIterations > DM_CONFIG.FLASH_ITERATIONS * 2) {
      this.cancelHighScoreFlashing();
      return;
    }

    this.flashTimer += deltaTime;

    if (this.flashTimer < DM_CONFIG.FLASH_DURATION) {
      paint = false;
    } else if (this.flashTimer > DM_CONFIG.FLASH_DURATION * 2) {
      this.flashTimer = 0;
      this.flashIterations++;
    }

    if (paint) {
      this.drawHighScore();
    } else {
      this.clearHighScoreBounds();
    }
    this.flashingRafId = requestAnimationFrame(function () { self.flashHighScore(); });
  };

  DistanceMeter.prototype.startHighScoreFlashing = function () {
    if (this.flashingRafId === null) {
      this.flashingRafId = requestAnimationFrame(
        function () { G.runner.distanceMeter.flashHighScore(); });
    }
    this.highScoreFlashing = true;
  };

  DistanceMeter.prototype.isHighScoreFlashing = function () {
    return this.highScoreFlashing;
  };

  DistanceMeter.prototype.cancelHighScoreFlashing = function () {
    if (this.flashingRafId !== null) {
      cancelAnimationFrame(this.flashingRafId);
      this.flashingRafId = null;
    }
    this.highScoreFlashing = false;
    this.flashTimer = 0;
    this.flashIterations = 0;
    this.clearHighScoreBounds();
    this.drawHighScore();
  };

  /* =======================================================================
   * 11. 结束面板（game_over_panel.ts）
   * ===================================================================== */
  var RESTART_ANIM_DURATION = 875;
  var LOGO_PAUSE_DURATION = 875;
  var GO_ANIM = {
    frames: [0, 36, 72, 108, 144, 180, 216, 252],
    msPerFrame: RESTART_ANIM_DURATION / 8
  };
  var GO_PANEL_DIM = {
    textX: 0, textY: 13, textWidth: 191, textHeight: 11,
    restartWidth: 36, restartHeight: 32
  };

  function GameOverPanel(canvas, textImgPos, restartImgPos, dimensions) {
    this.ctx = canvas.getContext('2d');
    this.canvasDimensions = { width: dimensions.width, height: dimensions.height };
    this.textImgPos = textImgPos;
    this.restartImgPos = restartImgPos;
    this.currentFrame = 0;
    this.animTimer = 0;
    this.flashTimer = 0;
    this.frameTimeStamp = 0;
    this.gameOverRafId = null;
  }

  GameOverPanel.prototype.drawGameOverText = function (dimensions) {
    var centerX = this.canvasDimensions.width / 2;
    var textSourceX = dimensions.textX;
    var textSourceY = dimensions.textY;
    var textSourceWidth = dimensions.textWidth;
    var textSourceHeight = dimensions.textHeight;

    var textTargetX = Math.round(centerX - (dimensions.textWidth / 2));
    var textTargetY = Math.round((this.canvasDimensions.height - 25) / 3);
    var textTargetWidth = dimensions.textWidth;
    var textTargetHeight = dimensions.textHeight;

    if (IS_HIDPI) {
      textSourceX *= 2;
      textSourceY *= 2;
      textSourceWidth *= 2;
      textSourceHeight *= 2;
    }

    textSourceX += this.textImgPos.x;
    textSourceY += this.textImgPos.y;

    this.ctx.save();
    this.ctx.drawImage(
      G.image, textSourceX, textSourceY, textSourceWidth, textSourceHeight,
      textTargetX, textTargetY, textTargetWidth, textTargetHeight);
    this.ctx.restore();
  };

  GameOverPanel.prototype.drawRestartButton = function () {
    var dimensions = GO_PANEL_DIM;
    var framePosX = GO_ANIM.frames[this.currentFrame];
    var restartSourceWidth = dimensions.restartWidth;
    var restartSourceHeight = dimensions.restartHeight;
    var restartTargetX =
      (this.canvasDimensions.width / 2) - (dimensions.restartHeight / 2);
    var restartTargetY = this.canvasDimensions.height / 2;

    if (IS_HIDPI) {
      restartSourceWidth *= 2;
      restartSourceHeight *= 2;
      framePosX *= 2;
    }

    this.ctx.save();
    this.ctx.drawImage(
      G.image, this.restartImgPos.x + framePosX, this.restartImgPos.y,
      restartSourceWidth, restartSourceHeight, restartTargetX, restartTargetY,
      dimensions.restartWidth, dimensions.restartHeight);
    this.ctx.restore();
  };

  GameOverPanel.prototype.draw = function () {
    // 撞毁瞬间画面定格，主循环已停止，这里只叠加文字与重开按钮动画
    this.drawGameOverText(GO_PANEL_DIM);
    this.drawRestartButton();
    this.update();
  };

  GameOverPanel.prototype.update = function () {
    var now = getTimeStamp();
    var deltaTime = now - (this.frameTimeStamp || now);
    this.frameTimeStamp = now;
    this.animTimer += deltaTime;
    this.flashTimer += deltaTime;

    if (this.currentFrame === 0 && this.animTimer > LOGO_PAUSE_DURATION) {
      this.animTimer = 0;
      this.currentFrame++;
      this.drawRestartButton();
    } else if (this.currentFrame > 0 && this.currentFrame < GO_ANIM.frames.length) {
      if (this.animTimer >= GO_ANIM.msPerFrame) {
        this.currentFrame++;
        this.drawRestartButton();
      }
    } else if (this.currentFrame === GO_ANIM.frames.length) {
      this.reset();
      return;
    }

    var self = this;
    this.gameOverRafId = requestAnimationFrame(function () { self.update(); });
  };

  GameOverPanel.prototype.reset = function () {
    if (this.gameOverRafId) {
      cancelAnimationFrame(this.gameOverRafId);
      this.gameOverRafId = null;
    }
    this.animTimer = 0;
    this.frameTimeStamp = 0;
    this.flashTimer = 0;
    this.currentFrame = 0;
    if (this.canvasDimensions.width) {
      this.clear();
    }
  };

  GameOverPanel.prototype.clear = function () {
    this.ctx.clearRect(0, 0, this.canvasDimensions.width, this.canvasDimensions.height);
  };

  /* =======================================================================
   * 12. 地平线总控（horizon.ts）
   * ===================================================================== */
  function Horizon(canvas, dimensions, gapCoefficient) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dimensions = dimensions;
    this.gapCoefficient = gapCoefficient;
    this.obstacles = [];
    this.obstacleHistory = [];
    this.cloudFrequency = CONFIG.cloudFrequency;
    this.cloudSpeed = CONFIG.bgCloudSpeed;
    this.clouds = [];
    this.horizonLines = [];
    this.obstacleTypes = OBSTACLE_TYPES;
    this.spritePos = spritePos();

    this.addCloud();

    for (var i = 0; i < LINE_CONFIGS.length; i++) {
      this.horizonLines.push(new HorizonLine(this.canvas, LINE_CONFIGS[i]));
    }

    this.nightMode = new NightMode(
      this.canvas, this.spritePos.moon, this.dimensions.height);
  }

  Horizon.prototype.update = function (deltaTime, currentSpeed, updateObstacles, showNightMode) {
    for (var i = 0; i < this.horizonLines.length; i++) {
      this.horizonLines[i].update(deltaTime, currentSpeed);
    }

    this.nightMode.update(showNightMode);
    this.updateClouds(deltaTime, currentSpeed);

    if (updateObstacles) {
      this.updateObstacles(deltaTime, currentSpeed);
    }
  };

  Horizon.prototype.updateBackgroundEl = function (elSpeed, list, maxEl, addFn, frequency) {
    var numElements = list.length;
    if (!numElements) { addFn(); return; }

    for (var i = numElements - 1; i >= 0; i--) {
      list[i].update(elSpeed);
    }

    var lastEl = list[list.length - 1];
    if (numElements < maxEl &&
      (this.dimensions.width - lastEl.xPos) > lastEl.gap &&
      frequency > Math.random()) {
      addFn();
    }
  };

  Horizon.prototype.updateClouds = function (deltaTime, speed) {
    var elSpeed = this.cloudSpeed / 1000 * deltaTime * speed;
    this.updateBackgroundEl(
      elSpeed, this.clouds, CONFIG.maxClouds, this.addCloud.bind(this),
      this.cloudFrequency);

    this.clouds = this.clouds.filter(function (obj) { return !obj.remove; });
  };

  Horizon.prototype.updateObstacles = function (deltaTime, currentSpeed) {
    var updatedObstacles = this.obstacles.slice(0);

    for (var i = 0; i < this.obstacles.length; i++) {
      this.obstacles[i].update(deltaTime, currentSpeed);
      if (this.obstacles[i].remove) {
        updatedObstacles.shift();
      }
    }
    this.obstacles = updatedObstacles;

    if (this.obstacles.length > 0) {
      var lastObstacle = this.obstacles[this.obstacles.length - 1];
      if (lastObstacle && !lastObstacle.followingObstacleCreated &&
        lastObstacle.isVisible() &&
        (lastObstacle.xPos + lastObstacle.width + lastObstacle.gap) < this.dimensions.width) {
        this.addNewObstacle(currentSpeed);
        lastObstacle.followingObstacleCreated = true;
      }
    } else {
      this.addNewObstacle(currentSpeed);
    }
  };

  Horizon.prototype.removeFirstObstacle = function () { this.obstacles.shift(); };

  Horizon.prototype.addNewObstacle = function (currentSpeed) {
    var obstacleCount = this.obstacleTypes.length - 1;
    var obstacleTypeIndex = obstacleCount > 0 ? getRandomNum(0, obstacleCount) : 0;
    var obstacleType = this.obstacleTypes[obstacleTypeIndex];

    if (this.duplicateObstacleCheck(obstacleType.type) ||
      currentSpeed < obstacleType.minSpeed) {
      this.addNewObstacle(currentSpeed);
    } else {
      var obstacleSpritePos = this.spritePos[obstacleType.type];
      this.obstacles.push(new Obstacle(
        this.canvas, obstacleType, obstacleSpritePos, this.dimensions,
        this.gapCoefficient, currentSpeed, obstacleType.width));

      this.obstacleHistory.unshift(obstacleType.type);
      if (this.obstacleHistory.length > 1) {
        this.obstacleHistory.splice(CONFIG.maxObstacleDuplication);
      }
    }
  };

  Horizon.prototype.duplicateObstacleCheck = function (nextObstacleType) {
    var duplicateCount = 0;
    for (var i = 0; i < this.obstacleHistory.length; i++) {
      duplicateCount = this.obstacleHistory[i] === nextObstacleType ?
        duplicateCount + 1 : 0;
    }
    return duplicateCount >= CONFIG.maxObstacleDuplication;
  };

  Horizon.prototype.reset = function () {
    this.obstacles = [];
    for (var l = 0; l < this.horizonLines.length; l++) {
      this.horizonLines[l].reset();
    }
    this.nightMode.reset();
  };

  Horizon.prototype.addCloud = function () {
    this.clouds.push(new Cloud(this.canvas, this.spritePos.cloud, this.dimensions.width));
  };

  /* =======================================================================
   * 13. 游戏主体（offline.ts Runner）
   * ===================================================================== */
  var KEYCODES = {
    jump: [38, 32],   // ↑ / 空格
    duck: [40],       // ↓
    restart: [13]     // Enter
  };

  /**
   * 归一化按键：优先取 keyCode，退化到 code / key。
   * （非美式键盘布局与自动化输入下 keyCode 可能缺失）
   */
  var CODE_TO_KEYCODE = {
    Space: 32, ArrowUp: 38, ArrowDown: 40, Enter: 13, NumpadEnter: 13,
    Up: 38, Down: 40
  };

  function keyCodeOf(e) {
    if (typeof e.keyCode === 'number' && e.keyCode) { return e.keyCode; }
    if (e.code && CODE_TO_KEYCODE[e.code]) { return CODE_TO_KEYCODE[e.code]; }
    if (e.key && CODE_TO_KEYCODE[e.key]) { return CODE_TO_KEYCODE[e.key]; }
    if (e.key === ' ') { return 32; }
    return 0;
  }

  function isKeyboardEvent(e) {
    return e.type === 'keydown' || e.type === 'keyup' ||
      e instanceof KeyboardEvent;
  }

  function Runner(containerEl, outsideElement) {
    this.outsideElement = outsideElement;
    this.containerEl = containerEl;
    this.canvas = containerEl.querySelector('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.dimensions = { width: DEFAULT_DIMENSIONS.width, height: DEFAULT_DIMENSIONS.height };

    this.playing = false;
    this.playingIntro = false;
    this.activated = false;
    this.crashed = false;
    this.paused = false;
    this.inverted = false;
    // 官方会读取 prefers-color-scheme；此处统一采用经典浅色底 + CSS 反色实现夜间模式
    this.isDarkMode = false;
    this.time = 0;
    this.runningTime = 0;
    this.currentSpeed = CONFIG.speed;
    this.distanceRan = 0;
    this.msPerFrame = 1000 / FPS;
    this.raqId = 0;
    this.updatePending = false;
    this.invertTimer = 0;
    this.invertTrigger = false;
    this.highestScore = 0;
    this.playCount = 0;
    this.soundFx = {};
    this.audioContext = null;
    this.gameOverPanel = null;
    this.touchController = null;
    this.resizeTimerId = undefined;

    this.highestScore = this.loadHighScore();
    this.tRex = null;
    this.horizon = null;
    this.distanceMeter = null;

    this.init();
  }

  Runner.prototype.init = function () {
    this.ctx.fillStyle = '#f7f7f7';
    this.ctx.fill();
    updateCanvasScaling(this.canvas, this.dimensions.width, this.dimensions.height);
    this.ctx = this.canvas.getContext('2d');
    G.ctx = this.ctx;

    this.setSpeed();

    this.horizon = new Horizon(this.canvas, this.dimensions, CONFIG.gapCoefficient);
    this.distanceMeter = new DistanceMeter(
      this.canvas, spritePos().textSprite, this.dimensions.width);
    this.tRex = new Trex(this.canvas);

    this.startListening();
    this.update();

    var self = this;
    window.addEventListener('resize', function () { self.debounceResize(); });
  };

  /* ---------------- 高分持久化（官方用 cookie，这里用 localStorage） ---------------- */
  Runner.prototype.highScoreKey = function () {
    return 'chrome-dino-highest-score';
  };

  Runner.prototype.loadHighScore = function () {
    try {
      var value = window.localStorage.getItem(this.highScoreKey());
      return value ? parseInt(value, 10) || 0 : 0;
    } catch (e) {
      return 0;
    }
  };

  Runner.prototype.saveHighScore = function (distance, reset) {
    distance = Math.round(distance);
    if (reset) {
      this.highestScore = 0;
    } else if (distance > this.highestScore) {
      this.highestScore = distance;
    }
    try {
      window.localStorage.setItem(this.highScoreKey(), String(this.highestScore));
    } catch (e) { /* file:// 下可能不可用，仅内存保存 */ }
    this.distanceMeter.setHighScore(this.highestScore);
  };

  /* ---------------- 音效 ---------------- */
  Runner.prototype.loadSounds = function () {
    if (!this.audioContext) {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) { return; }
      this.audioContext = new AudioCtor();
    }
    if (this.audioContext.state === 'suspended') {
      this.audioContext.resume();
    }

    var self = this;
    var mapping = {
      BUTTON_PRESS: ASSETS.sfxPress,
      HIT: ASSETS.sfxHit,
      SCORE: ASSETS.sfxScore
    };

    Object.keys(mapping).forEach(function (key) {
      if (self.soundFx[key]) { return; }
      try {
        self.audioContext.decodeAudioData(
          base64ToArrayBuffer(mapping[key]),
          function (audioBuffer) { self.soundFx[key] = audioBuffer; },
          function () { /* 解码失败静默降级，不影响游戏本体 */ });
      } catch (e) { /* 音频不可用时静音运行 */ }
    });
  };

  Runner.prototype.playSound = function (soundBuffer) {
    if (soundBuffer && this.audioContext) {
      var sourceNode = this.audioContext.createBufferSource();
      sourceNode.buffer = soundBuffer;
      sourceNode.connect(this.audioContext.destination);
      sourceNode.start(0);
    }
  };

  /* ---------------- 速度与尺寸 ---------------- */
  Runner.prototype.setSpeed = function (newSpeed) {
    var speed = newSpeed || this.currentSpeed;
    if (this.dimensions.width < DEFAULT_DIMENSIONS.width) {
      var mobileSpeed = speed * this.dimensions.width /
        DEFAULT_DIMENSIONS.width * CONFIG.mobileSpeedCoefficient;
      this.currentSpeed = mobileSpeed > speed ? speed : mobileSpeed;
    } else if (newSpeed) {
      this.currentSpeed = newSpeed;
    }
  };

  Runner.prototype.debounceResize = function () {
    var self = this;
    if (this.resizeTimerId === undefined) {
      this.resizeTimerId = window.setInterval(function () {
        self.adjustDimensions();
      }, 250);
    }
  };

  /**
   * 逻辑画布恒为 600x150；窄屏时由外层容器整体等比缩小，
   * 因此这里只需重新套用一次 backing store 缩放并重绘当前帧。
   */
  Runner.prototype.adjustDimensions = function () {
    window.clearInterval(this.resizeTimerId);
    this.resizeTimerId = undefined;

    updateCanvasScaling(this.canvas, this.dimensions.width, this.dimensions.height);
    this.ctx = this.canvas.getContext('2d');
    G.ctx = this.ctx;
    this.ctx.fillStyle = '#f7f7f7';
    this.ctx.fill();

    this.clearCanvas();
    this.horizon.update(0, 0, true, false);
    this.tRex.update(0);
    this.distanceMeter.update(0, Math.ceil(this.distanceRan));
    fitStage();
  };

  /* ---------------- 事件 ---------------- */
  Runner.prototype.startListening = function () {
    var self = this;
    // 键盘统一挂在 document 上：本页没有浏览器错误页的自动聚焦环境
    document.addEventListener('keydown', function (e) { self.onKeyDown(e); });
    document.addEventListener('keyup', function (e) { self.onKeyUp(e); });

    // 触屏：挂在 document 上，实现「点屏幕任意位置都能开始/跳跃」。
    // 手机竖屏下画布只有 90px 上下高（600x150 等比缩放后），只挂画布会大量点空。
    // passive:false 才能 preventDefault，挡住滚动、双击缩放与下拉刷新。
    var touchOpts = { passive: false };
    document.addEventListener('touchstart', function (e) { self.onKeyDown(e); }, touchOpts);
    document.addEventListener('touchend', function (e) { self.onKeyUp(e); }, touchOpts);
    document.addEventListener('touchcancel', function (e) { self.onKeyUp(e); }, touchOpts);

    // 指针同样挂 document。PointerEvent 是 MouseEvent 的子类，
    // 因此触摸产生的 pointerup 也能进入 isLeftClickOnCanvas 的结束界面重开判定——
    // 这正是官方手机上「撞毁后点一下重开」所依赖的路径。
    document.addEventListener('pointerdown', function (e) { self.onKeyDown(e); });
    document.addEventListener('pointerup', function (e) { self.onKeyUp(e); });
    document.addEventListener('pointercancel', function (e) { self.onKeyUp(e); });

    document.addEventListener('visibilitychange', function () { self.onVisibilityChange(); });
    window.addEventListener('blur', function () {
      if (self.playing && !self.crashed && !self.paused) { self.pause(); }
    });
  };

  Runner.prototype.onVisibilityChange = function () {
    if (this.playing && document.hidden && !this.crashed && !this.paused) {
      this.pause();
    } else if (!document.hidden && this.paused && !this.crashed) {
      this.paused = false;
      this.time = 0;
      this.update();
    }
  };

  Runner.prototype.pause = function () {
    if (!this.crashed) {
      this.stop();
      this.paused = true;
      this.time = 0;
      this.clearCanvas();
      this.horizon.update(0, 0, true, false);
      this.tRex.update(0);
      this.distanceMeter.update(0, Math.ceil(this.distanceRan));
    }
  };

  /** 从暂停状态继续（官方 play()） */
  Runner.prototype.play = function () {
    if (!this.crashed) {
      this.setPlayStatus(true);
      this.paused = false;
      this.tRex.update(0, STATUS.RUNNING);
      this.time = getTimeStamp();
      this.update();
    }
  };

  /**
   * 结束界面的交互：高分区域单击 -> 闪烁，再次单击 -> 清零（官方彩蛋）；
   * 其余位置 -> 直接重开。
   */
  Runner.prototype.handleGameOverClicks = function (e) {
    if (e.preventDefault) { e.preventDefault(); }
    if (this.distanceMeter.hasClickedOnHighScore(e) && this.highestScore) {
      if (this.distanceMeter.isHighScoreFlashing()) {
        this.saveHighScore(0, true);
        this.distanceMeter.resetHighScore();
      } else {
        this.distanceMeter.startHighScoreFlashing();
      }
    } else {
      this.distanceMeter.cancelHighScoreFlashing();
      this.restart();
    }
  };

  /**
   * 结束界面的点击判定：是否为画布上的左键点击（Windows 上右键也触发 click）。
   *
   * 要点：PointerEvent 继承自 MouseEvent，所以触摸产生的 pointerup 会走到这里。
   * 桌面鼠标保持官方口径——必须点在画布上；触屏 / 手写笔一律算命中：
   * 手机竖屏下画布被等比缩放到只有 90px 上下高，且本页除游戏外没有任何其它可点元素，
   * 要求精准点在画布内会让「点一下重开」大量点空。
   */
  Runner.prototype.isLeftClickOnCanvas = function (e) {
    if (typeof MouseEvent === 'undefined' || !(e instanceof MouseEvent)) {
      return false;
    }
    if (e.type !== 'pointerup' || e.button == null || e.button >= 2) {
      return false;
    }
    if (e.pointerType === 'touch' || e.pointerType === 'pen') {
      return true;
    }
    return e.target === this.canvas;
  };

  Runner.prototype.isRunning = function () {
    return this.activated && !this.crashed && !this.paused && !this.playingIntro;
  };

  Runner.prototype.isCanvasInView = function () {
    return this.containerEl.getBoundingClientRect().top > -10;
  };

  Runner.prototype.onKeyDown = function (e) {
    var isPointerDown = e.type === 'pointerdown';
    var isTouchInput = e.type === 'touchstart' ||
      (isPointerDown && e.pointerType !== 'mouse');

    // 触屏上尽量拦住浏览器默认行为：页面滚动、双击缩放、下拉刷新。
    // 官方只在 playing 时拦截（错误页本身没有可滚动内容），这里把触屏输入全程拦住，
    // 否则停在结束面板时上下拖动会把页面拖出白边。
    if (e.preventDefault && e.cancelable !== false &&
        ((IS_MOBILE && this.playing) || (isTouchInput && HAS_TOUCH))) {
      e.preventDefault();
    }

    var keyCode = keyCodeOf(e);
    var isJumpKey = isKeyboardEvent(e) && KEYCODES.jump.indexOf(keyCode) !== -1;
    var isDuckKey = isKeyboardEvent(e) && KEYCODES.duck.indexOf(keyCode) !== -1;
    var isTouch = e.type === 'touchstart' || isPointerDown;

    if (isJumpKey && keyCode === 32 && e.preventDefault) { e.preventDefault(); }

    if (!this.crashed && !this.paused) {
      if (isJumpKey || isTouch) {
        if (e.cancelable !== false && e.preventDefault) { e.preventDefault(); }

        if (!this.playing) {
          try { this.loadSounds(); } catch (err) { /* 音频不可用时静音运行 */ }
          this.setPlayStatus(true);
          this.update();
        }

        if (!this.tRex.jumping && !this.tRex.ducking) {
          this.playSound(this.soundFx.BUTTON_PRESS);
          this.tRex.startJump(this.currentSpeed);
        }
      } else if (this.playing && isDuckKey) {
        e.preventDefault();
        if (this.tRex.jumping) {
          this.tRex.setSpeedDrop();
        } else if (!this.tRex.jumping && !this.tRex.ducking) {
          this.tRex.setDuck(true);
        }
      }
    }
  };

  Runner.prototype.onKeyUp = function (e) {
    var keyCode = keyCodeOf(e);
    var isJumpKey = KEYCODES.jump.indexOf(keyCode) !== -1 ||
      e.type === 'touchend' || e.type === 'pointerup' ||
      e.type === 'touchcancel' || e.type === 'pointercancel';

    if (this.isRunning() && isJumpKey) {
      this.tRex.endJump();
    } else if (KEYCODES.duck.indexOf(keyCode) !== -1) {
      this.tRex.speedDrop = false;
      this.tRex.setDuck(false);
    } else if (this.crashed) {
      // 撞毁后需间隔 gameoverClearTime(1200ms) 才允许用跳跃键重开；
      // Enter 与鼠标点击不受此限制（官方行为）
      var deltaTime = getTimeStamp() - this.time;
      if (this.isCanvasInView() &&
        (KEYCODES.restart.indexOf(keyCode) !== -1 ||
          this.isLeftClickOnCanvas(e) ||
          (deltaTime >= CONFIG.gameoverClearTime &&
            KEYCODES.jump.indexOf(keyCode) !== -1))) {
        this.handleGameOverClicks(e);
      }
    } else if (this.paused && isJumpKey) {
      this.tRex.reset();
      this.play();
    }
  };

  Runner.prototype.setPlayStatus = function (isPlaying) {
    this.playing = isPlaying;
  };

  Runner.prototype.playIntro = function () {
    if (!this.activated && !this.crashed) {
      this.playingIntro = true;
      this.tRex.playingIntro = true;

      this.distanceMeter.setHighScore(this.highestScore);

      var self = this;
      var onAnimEnd = function () {
        self.containerEl.removeEventListener('animationend', onAnimEnd);
        self.startGame();
      };
      this.containerEl.addEventListener('animationend', onAnimEnd);

      this.containerEl.classList.add('intro');
      this.containerEl.style.width = this.dimensions.width + 'px';

      this.setPlayStatus(true);
      this.activated = true;
    } else if (this.crashed) {
      this.restart();
    }
  };

  Runner.prototype.startGame = function () {
    this.runningTime = 0;
    this.playingIntro = false;
    this.tRex.playingIntro = false;
    this.containerEl.classList.remove('intro');
    this.containerEl.style.webkitAnimation = '';
    this.playCount++;
  };

  Runner.prototype.clearCanvas = function () {
    this.ctx.clearRect(0, 0, this.dimensions.width, this.dimensions.height);
  };

  /* ---------------- 主循环 ---------------- */
  Runner.prototype.update = function () {
    this.updatePending = false;

    var now = getTimeStamp();
    var deltaTime = now - (this.time || now);
    // 防止标签页切回时单帧位移过大
    if (deltaTime > 100) { deltaTime = 100; }
    this.time = now;

    if (this.playing) {
      this.clearCanvas();

      if (this.tRex.jumping) {
        this.tRex.updateJump(deltaTime);
      }

      this.runningTime += deltaTime;
      var hasObstacles = this.runningTime > CONFIG.clearTime;

      if (this.tRex.jumpCount === 1 && !this.playingIntro) {
        this.playIntro();
      }

      if (this.playingIntro) {
        this.horizon.update(0, this.currentSpeed, hasObstacles, false);
      } else if (!this.crashed) {
        var showNightMode = this.isDarkMode !== this.inverted;
        deltaTime = !this.activated ? 0 : deltaTime;
        this.horizon.update(deltaTime, this.currentSpeed, hasObstacles, showNightMode);
      }

      var firstObstacle = this.horizon.obstacles[0];
      var collision = hasObstacles && firstObstacle &&
        this.checkForCollision(firstObstacle, this.tRex);

      if (!collision) {
        this.distanceRan += this.currentSpeed * deltaTime / this.msPerFrame;
        if (this.currentSpeed < CONFIG.maxSpeed) {
          this.currentSpeed += CONFIG.acceleration;
        }
      } else {
        this.gameOver();
      }

      var playAchievementSound =
        this.distanceMeter.update(deltaTime, Math.ceil(this.distanceRan));

      if (playAchievementSound) {
        this.playSound(this.soundFx.SCORE);
      }

      // 夜间模式切换
      if (this.invertTimer > CONFIG.invertFadeDuration) {
        this.invertTimer = 0;
        this.invertTrigger = false;
        this.invert(false);
      } else if (this.invertTimer) {
        this.invertTimer += deltaTime;
      } else {
        var actualDistance =
          this.distanceMeter.getActualDistance(Math.ceil(this.distanceRan));
        if (actualDistance > 0) {
          this.invertTrigger = !(actualDistance % CONFIG.invertDistance);
          if (this.invertTrigger && this.invertTimer === 0) {
            this.invertTimer += deltaTime;
            this.invert(false);
          }
        }
      }
    }

    if (this.playing ||
      (!this.activated && this.tRex.blinkCount < CONFIG.maxBlinkCount)) {
      this.tRex.update(deltaTime);
      this.scheduleNextUpdate();
    }
  };

  Runner.prototype.scheduleNextUpdate = function () {
    var self = this;
    if (!this.updatePending) {
      this.updatePending = true;
      this.raqId = requestAnimationFrame(function () { self.update(); });
    }
  };

  Runner.prototype.stop = function () {
    this.setPlayStatus(false);
    this.paused = true;
    if (this.raqId) {
      cancelAnimationFrame(this.raqId);
      this.raqId = 0;
    }
  };

  /** 夜间模式：对根元素加 inverted 类，靠 CSS filter 反转全部颜色（官方做法） */
  Runner.prototype.invert = function (reset) {
    var root = document.documentElement;
    if (reset) {
      root.classList.remove('inverted');
      this.invertTimer = 0;
      this.inverted = false;
    } else {
      this.inverted = this.invertTrigger;
      root.classList.toggle('inverted', this.invertTrigger);
    }
  };

  Runner.prototype.gameOver = function () {
    this.playSound(this.soundFx.HIT);
    vibrate(200);

    this.stop();
    this.crashed = true;
    this.distanceMeter.achievement = false;
    this.tRex.update(100, STATUS.CRASHED);

    if (!this.gameOverPanel) {
      this.gameOverPanel = new GameOverPanel(
        this.canvas, spritePos().textSprite, spritePos().restart, this.dimensions);
    }
    this.gameOverPanel.draw();

    if (this.distanceRan > this.highestScore) {
      this.saveHighScore(this.distanceRan);
    }

    this.time = getTimeStamp();
    document.body.classList.add('crashed');
  };

  Runner.prototype.restart = function () {
    if (!this.raqId) {
      this.playCount++;
      this.runningTime = 0;
      this.setPlayStatus(true);
      this.paused = false;
      this.crashed = false;
      this.distanceRan = 0;
      this.setSpeed(CONFIG.speed);
      this.time = getTimeStamp();
      document.body.classList.remove('crashed');
      this.clearCanvas();
      this.distanceMeter.reset();
      this.horizon.reset();
      this.tRex.reset();
      this.playSound(this.soundFx.BUTTON_PRESS);
      this.invert(true);
      this.update();
      this.gameOverPanel.reset();
    }
  };

  /* ---------------- 碰撞检测（offline.ts checkForCollision） ---------------- */
  function createAdjustedCollisionBox(box, adjustment) {
    return new Box(
      box.x + adjustment.x, box.y + adjustment.y, box.width, box.height);
  }

  function boxCompare(box1, box2) {
    return box1.x < box2.x + box2.width &&
      box1.x + box1.width > box2.x &&
      box1.y < box2.y + box2.height &&
      box1.y + box1.height > box2.y;
  }

  Runner.prototype.checkForCollision = function (obstacle, tRex) {
    // 精灵四周有 1px 空白边框，故整体内缩 1px
    var tRexBox = new Box(
      tRex.xPos + 1, tRex.yPos + 1, tRex.config.width - 2, tRex.config.height - 2);
    var obstacleBox = new Box(
      obstacle.xPos + 1, obstacle.yPos + 1,
      obstacle.typeConfig.width * obstacle.size - 2,
      obstacle.typeConfig.height - 2);

    if (boxCompare(tRexBox, obstacleBox)) {
      var collisionBoxes = obstacle.collisionBoxes;
      var tRexCollisionBoxes = tRex.getCollisionBoxes();

      for (var t = 0; t < tRexCollisionBoxes.length; t++) {
        for (var o = 0; o < collisionBoxes.length; o++) {
          var adjTrexBox = createAdjustedCollisionBox(tRexCollisionBoxes[t], tRexBox);
          var adjObstacleBox = createAdjustedCollisionBox(collisionBoxes[o], obstacleBox);
          if (boxCompare(adjTrexBox, adjObstacleBox)) {
            return [adjTrexBox, adjObstacleBox];
          }
        }
      }
    }
    return null;
  };

  /* =======================================================================
   * 14. 启动
   * ===================================================================== */

  /** 逻辑画布恒为 600x150，窄屏时整体等比缩放 */
  function fitStage() {
    var stage = document.getElementById('stage');
    var fit = document.getElementById('fit');
    if (!stage || !fit) { return; }
    var avail = Math.min(window.innerWidth - 16, DEFAULT_DIMENSIONS.width);
    // 下限 0.4：320px 宽的小屏手机也能整条放下（600 * 0.4 = 240 逻辑 px）
    var scale = Math.max(0.4, Math.min(1, avail / DEFAULT_DIMENSIONS.width));
    stage.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
    fit.style.height = (DEFAULT_DIMENSIONS.height * scale) + 'px';
  }

  function boot() {
    G.spritePos = IS_HIDPI ? SPRITE_POS.hdpi : SPRITE_POS.ldpi;
    // 先定输入形态，操作提示据此二选一显示（避免先闪一下键盘文案）
    document.body.classList.add(HAS_TOUCH ? 'touch' : 'keyboard');
    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);

    var img = new Image();
    img.onload = function () {
      G.image = img;
      var container = document.getElementById('runner-container');
      var outside = document.getElementById('stage');
      G.runner = new Runner(container, outside);
      // 供调试/自动化测试访问（官方亦有 Runner.instance_ 全局单例）
      window.__dino = G.runner;
      document.body.classList.add('ready');
      var hint = document.getElementById('hint');
      if (hint) { hint.classList.add('show'); }
      // 首次开始游戏后淡出操作提示
      var watcher = window.setInterval(function () {
        if (G.runner.playing || G.runner.crashed) {
          if (hint) { hint.classList.remove('show'); }
          window.clearInterval(watcher);
        }
      }, 200);
    };
    img.onerror = function () {
      var hint = document.getElementById('hint');
      if (hint) { hint.textContent = '精灵图加载失败'; hint.classList.add('show'); }
    };
    img.src = IS_HIDPI ? ASSETS.sprite2x : ASSETS.sprite1x;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
