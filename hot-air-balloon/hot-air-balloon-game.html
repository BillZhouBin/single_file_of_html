<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>热气球大冒险 · Hot Air Balloon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    /* 配色：去色世界 × 通电染色 */
    --paper:#100c08;
    --panel:#1b150e;
    --panel-2:#241c12;
    --line:#3a2f20;
    --ink:#f3ead8;
    --ink-dim:#a9987c;
    --ink-faint:#6f6353;
    --accent:#ffcf4d;        /* 通电金 主强调 */
    --accent-deep:#b9882a;
    --live:#3fd9c9;          /* 通电青 激活态 */
    --danger:#ff5e5e;
    --good:#5ee6a0;
    --font-display:'Press Start 2P','Courier New',monospace;
    --font-body:'VT323','Courier New',monospace;
    --fs-logo:clamp(15px,6vw,24px);
    --fs-title:clamp(12px,4.2vw,17px);
    --fs-hud:clamp(15px,5vw,19px);
    --fs-body:17px;
    --fs-micro:11px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(130% 90% at 50% -15%, #1d160e 0%, #100c08 55%, #0a0705 100%);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    -webkit-font-smoothing:none; image-rendering:pixelated;
  }
  .game-shell{
    position:relative;
    width:min(100vw, calc(100vh * 270 / 480));
    aspect-ratio:270 / 480;
    margin:auto;
    background:#0e0b08;
    box-shadow:0 0 0 2px var(--line), 0 0 0 4px #0a0705, 0 26px 60px -20px #000c;
    overflow:hidden;
  }
  canvas{ width:100%; height:100%; display:block; image-rendering:pixelated; background:#243a5e; touch-action:none; -webkit-user-select:none; user-select:none; }

  /* ── HUD ── */
  .hud{ position:absolute; inset:0; pointer-events:none; font-family:var(--font-body); z-index:5; }
  .hud-top{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:10px 12px; gap:8px;
  }
  .hud-top .score, .hud-top .best{ display:flex; flex-direction:column; gap:2px; line-height:1; }
  .hud-top .best{ align-items:flex-end; }
  .hud-top .score .k, .hud-top .best .k{ font-family:var(--font-display); font-size:var(--fs-micro); color:var(--ink-faint); letter-spacing:1px; }
  .hud-top .score .v{ font-family:var(--font-display); font-size:var(--fs-hud); color:var(--accent); text-shadow:1px 1px 0 #00000080; letter-spacing:1px; }
  .hud-top .best .v{ font-family:var(--font-display); font-size:calc(var(--fs-hud) * .72); color:var(--ink-dim); letter-spacing:1px; }
  .pause-btn{
    pointer-events:auto; cursor:pointer;
    width:38px; height:38px; flex:none; margin-top:2px;
    display:grid; place-items:center;
    background:var(--panel); border:2px solid var(--line); border-radius:0;
    color:var(--ink); font-family:var(--font-display); font-size:11px;
    box-shadow:2px 2px 0 #00000080;
    transition:transform .12s var(--ease), background .12s var(--ease);
  }
  .pause-btn:hover{ background:var(--panel-2); }
  .pause-btn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 #00000080; }
  .pause-btn:focus-visible{ outline:2px solid var(--live); outline-offset:2px; }
  .effects{
    position:absolute; left:0; right:0; top:74px;
    display:flex; flex-wrap:wrap; gap:6px; padding:0 12px;
    justify-content:flex-start;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--panel); border:2px solid var(--line); border-radius:0;
    padding:3px 7px; font-size:13px;
    box-shadow:2px 2px 0 #00000060;
  }
  .chip .dot{ width:9px; height:9px; border:1px solid #00000060; flex:none; }
  .chip .bar{ width:24px; height:5px; background:#00000080; overflow:hidden; }
  .chip .bar > i{ display:block; height:100%; background:currentColor; }

  /* ── 等级条 ── */
  .level-bar{
    position:absolute; left:12px; right:12px; top:52px;
    display:none; align-items:center; gap:6px;
    pointer-events:none; z-index:5;
  }
  .level-bar.show{ display:flex; }
  .level-bar .lbl{ font-family:var(--font-display); font-size:9px; color:var(--accent-deep); letter-spacing:1px; }
  .level-bar .lv{ color:var(--ink); font-family:var(--font-display); font-size:11px; min-width:14px; }
  .level-bar .track{ flex:1; height:6px; background:#00000080; border:1px solid var(--line); overflow:hidden; }
  .level-bar .track > i{ display:block; height:100%; background:var(--accent); transition:width .25s var(--ease); }

  /* ── Overlays ── */
  .overlay{
    position:absolute; inset:0; pointer-events:auto; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:28px 22px; text-align:center;
    background:linear-gradient(180deg, #0e0b08f2 0%, #140f09ee 100%);
  }
  .overlay::before{
    content:''; position:absolute; left:0; right:0; top:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 16px);
    opacity:.65;
  }
  .overlay.hidden{ display:none; }

  /* 装饰：黑白气球（呼应去色初始态） */
  .balloon-deco{ position:relative; width:54px; height:66px; animation:floaty 2.8s ease-in-out infinite; }
  .balloon-deco .body{
    position:absolute; top:0; left:7px; width:40px; height:46px;
    background:radial-gradient(circle at 34% 28%, #eef1f6, #9aa3b2 70%);
    border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;
    border:2px solid #15181f;
  }
  .balloon-deco .body::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:repeating-linear-gradient(90deg, transparent 0 7px, #15181f22 7px 8px);
  }
  .balloon-deco .rope{ position:absolute; top:44px; left:19px; width:2px; height:13px; background:#15181f; transform:rotate(9deg); }
  .balloon-deco .rope.r2{ left:33px; transform:rotate(-9deg); }
  .balloon-deco .basket{ position:absolute; bottom:0; left:18px; width:18px; height:12px; background:#7a4a2a; border:2px solid #15181f; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-7px) rotate(2deg); } }

  .logo{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .title{
    font-family:var(--font-display); font-size:var(--fs-logo); line-height:1.6;
    color:var(--ink); text-shadow:2px 2px 0 var(--accent-deep), 4px 4px 0 #00000060;
  }
  .title .em{ color:var(--accent); }
  .sub-en{ font-family:var(--font-display); font-size:9px; color:var(--ink-faint); letter-spacing:2px; }
  .subtitle{ font-size:var(--fs-body); color:var(--ink-dim); max-width:260px; line-height:1.25; }

  .best-card{
    display:inline-flex; align-items:center; gap:9px; padding:8px 16px;
    background:var(--panel); border:2px solid var(--line);
    box-shadow:3px 3px 0 #00000060;
  }
  .best-card .k{ font-family:var(--font-display); font-size:9px; color:var(--ink-faint); letter-spacing:1px; }
  .best-card .v{ font-family:var(--font-display); font-size:15px; color:var(--accent); }

  .tips{ display:flex; flex-direction:column; gap:7px; margin:2px 0; }
  .tip{ display:flex; align-items:center; gap:9px; font-size:var(--fs-body); color:var(--ink-dim); text-align:left; }
  .tip .ic{ width:13px; height:13px; flex:none; border:1px solid #00000050; }

  .big{ font-family:var(--font-display); font-size:clamp(18px,7vw,26px); color:var(--danger); text-shadow:2px 2px 0 #00000080; }
  .stat{ font-size:var(--fs-body); color:var(--ink-dim); }
  .stat b{ color:var(--accent); font-family:var(--font-display); font-size:14px; }

  .btn{
    pointer-events:auto; cursor:pointer; user-select:none;
    font-family:var(--font-display); font-size:12px;
    padding:14px 26px; border:0; border-radius:0;
    background:var(--accent); color:#1a1305;
    box-shadow:0 4px 0 var(--accent-deep), 0 4px 0 2px #00000040;
    transition:transform .12s var(--ease), box-shadow .12s var(--ease);
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 6px 0 var(--accent-deep), 0 6px 0 2px #00000040; }
  .btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--accent-deep), 0 0 0 2px #00000040; }
  .btn--ghost{ background:var(--panel); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 #00000080; }
  .btn--ghost:hover{ background:var(--panel-2); }
  .btn--ghost:active{ transform:translateY(4px); box-shadow:0 0 0 #00000080; }
  .btn:focus-visible, .btn--ghost:focus-visible{ outline:2px solid var(--live); outline-offset:2px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  /* ── 染色全屏闪光 ── */
  .flash{ position:absolute; inset:0; z-index:8; pointer-events:none; opacity:0; mix-blend-mode:screen; }
  .flash.dye{ animation: dyeflash .4s var(--ease); }
  @keyframes dyeflash{ 0%{opacity:.5;} 100%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation-duration:.001ms !important; }
    .flash.dye{ animation:none; }
    .balloon-deco{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="game-shell" id="shell">
    <canvas id="game" width="270" height="480"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="score" id="score">SCORE 000000</div>
        <button class="pause-btn" id="pauseBtn" aria-label="暂停">❚❚</button>
        <div class="best" id="best">BEST 0</div>
      </div>
      <div class="effects" id="effects"></div>
      <div class="level-bar" id="levelBar"><span class="lbl">LV</span><span class="lv" id="lvNum">1</span><span class="track"><i id="lvProg" style="width:0%"></i></span></div>
    </div>
    <div class="flash" id="flash"></div>

    <!-- 主菜单 -->
    <div class="overlay" id="menu">
      <div class="balloon-deco" aria-hidden="true">
        <div class="body"></div><div class="rope"></div><div class="rope r2"></div><div class="basket"></div>
      </div>
      <div class="logo">
        <div class="title">热气球<span class="em">大冒险</span></div>
        <div class="sub-en">HOT AIR BALLOON</div>
      </div>
      <div class="best-card"><span class="k">BEST</span><span class="v" id="menuBest">0</span></div>
      <div class="tips">
        <div class="tip"><span class="ic" style="background:var(--live)"></span>彩色闪电 · 染色无敌</div>
        <div class="tip"><span class="ic" style="background:var(--accent)"></span>宝石计分 · 擦边险胜 +5</div>
        <div class="tip"><span class="ic" style="background:var(--danger)"></span>躲避钢灰栅栏</div>
      </div>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>

    <!-- 暂停 -->
    <div class="overlay hidden" id="pause">
      <div class="title">已暂停</div>
      <div class="row">
        <button class="btn" id="resumeBtn">继续</button>
        <button class="btn btn--ghost" id="restartBtn1">重新开始</button>
        <button class="btn btn--ghost" id="menuBtn1">返回菜单</button>
      </div>
    </div>

    <!-- 结束 -->
    <div class="overlay hidden" id="over">
      <div class="big">GAME OVER</div>
      <div class="stat">本局分数 <b id="finalScore">0</b></div>
      <div class="stat">最高分 <b id="finalBest">0</b></div>
      <div class="row">
        <button class="btn" id="againBtn">再来一局</button>
        <button class="btn btn--ghost" id="menuBtn2">返回菜单</button>
      </div>
    </div>
  </div>

<script>
"use strict";
(function(){
  const W = 270, H = 480;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // ── 调色 ──
  const HUES = ['#3fd9c9', '#ff4d9d', '#ffd23f', '#5ee6a0'];
  const GEMS = ['#3fd9c9', '#ffd23f', '#ff6b5e'];
  const PU = {
    shield:  { color:'#9be7ff', label:'护盾' },
    slow:    { color:'#b56bff', label:'缓降' },
    magnet:  { color:'#ff8a3d', label:'吸铁' },
    double:  { color:'#ffd23f', label:'双倍' },
  };
  const PU_KEYS = Object.keys(PU);

  function shade(hex, f){ // 压暗 f∈(0,1)
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.round(r*f); g=Math.round(g*f); b=Math.round(b*f);
    return 'rgb('+r+','+g+','+b+')';
  }

  // ── 精灵生成 ──
  function buildBalloon(){
    const w=24, h=28, rows=[];
    for(let y=0;y<h;y++){
      let line='';
      for(let x=0;x<w;x++){
        if(y<22){
          const dx=x-11.5, dy=y-11, d=Math.sqrt(dx*dx+dy*dy);
          if(d>11) line+='.';
          else if(d>10) line+='O';
          else line += (x%2===0)?'T':'S';
        } else if(y===22){
          line += (x===9||x===14)?'R':'.';
        } else {
          if(x>=9 && x<=14){
            if(y===23||y===26) line+='O';
            else line += (x%2===0)?'B':'S';
          } else line+='.';
        }
      }
      rows.push(line);
    }
    return rows;
  }
  const BALLOON = buildBalloon();

  function buildGem(){
    return [
      "....G....",
      "...GWG...",
      "..GWGGW..",
      ".GWGGGGW.",
      "WGGGGGGGW",
      ".GWGGGGW.",
      "..GWGGW..",
      "...GWG...",
      "....G....",
    ];
  }
  const GEM = buildGem();

  function buildBolt(){
    return [
      "..OOOOOOO..",
      ".OLBBBBBBO.",
      "OBBBBBBBBBO",
      "OBBBBBBBBBO",
      "OBBLBBBBBBO",
      "OBBLBBBBBBO",
      "OBBBLBBBBBO",
      "OBBBBLBBBBO",
      "OBBBBBLBBO.",
      ".OBBBBBBBO.",
      "..OOOOOOO..",
    ];
  }
  const BOLT = buildBolt();

  function buildPowerup(){
    const w=11,h=11,rows=[];
    for(let y=0;y<h;y++){
      let line='';
      for(let x=0;x<w;x++){
        const dx=x-5,dy=y-5,d=Math.sqrt(dx*dx+dy*dy);
        if(d>5) line+='.';
        else if(d>4) line+='O';
        else line+='B';
      }
      rows.push(line);
    }
    return rows;
  }
  const POWERUP = buildPowerup();

  function drawSprite(rows, pal, ox, oy){
    ox=Math.round(ox); oy=Math.round(oy);
    for(let y=0;y<rows.length;y++){
      const row=rows[y];
      for(let x=0;x<row.length;x++){
        const ch=row[x];
        if(ch==='.'||ch===' ') continue;
        const c=pal[ch];
        if(!c) continue;
        ctx.fillStyle=c;
        ctx.fillRect(ox+x, oy+y, 1, 1);
      }
    }
  }

  // ── 状态 ──
  const STATE = { MENU:0, PLAY:1, PAUSE:2, OVER:3 };
  let state = STATE.MENU;
  let balloon, fences, gems, bolts, powerups, particles, floatTexts;
  let score, best, spawnTimer, elapsed, inv, invColor, fx;
  best = parseInt(localStorage.getItem('hotAirBalloon.best')||'0',10) || 0;

  function reset(){
    balloon = { x:W/2, y:H-64, w:24, h:28, speed:230, vx:0, tilt:0 };
    fences=[]; gems=[]; bolts=[]; powerups=[]; particles=[]; floatTexts=[];
    score=0; spawnTimer=0; elapsed=0; inv=0; invColor=null;
    fx={ slow:0, magnet:0, double:0 };
  }

  // ── 难度（曲线重调：200 分/级，下落更缓，生成 floor 0.72）──
  function level(){ return Math.min(12, Math.floor(score/200)); }
  function fallSpeed(){ return 60 + level()*12; }
  function rowInterval(){ return Math.max(0.72, 1.4 - level()*0.057); }
  function boltChance(){ return Math.min(0.09, 0.05 + level()*0.0035); }   // 5% → 9%（后期救命稻草增多）
  function puChance(){ return Math.max(0.05, 0.09 - level()*0.0035); }     // 9% → 5%（后期更紧张）

  // ── 生成一波 ──
  function freeX(minGap, avoid){
    for(let i=0;i<20;i++){
      const x = 14 + Math.random()*(W-28);
      let ok=true;
      for(const a of avoid){
        if(x > a.x-a.gap-minGap && x < a.x+a.gap+minGap){ ok=false; break; }
      }
      if(ok) return x;
    }
    return W/2;
  }

  function spawnRow(){
    const L = 45 + Math.random()*85;            // ≤ 135 = 半屏
    const maxX = W - 8 - L;
    const fx0 = 8 + Math.random()*Math.max(1, maxX-8);
    fences.push({ x:fx0, y:-18, w:L, h:16 });

    const avoid = [ {x:fx0+L/2, gap:L/2} ];
    // 宝石 1~2
    const nG = 1 + (Math.random()<0.5?1:0);
    for(let i=0;i<nG;i++){
      const gx = freeX(12, avoid);
      avoid.push({x:gx, gap:9});
      gems.push({ x:gx, y:-10, type:Math.floor(Math.random()*GEMS.length), got:false });
    }
    // 闪电（概率随难度升）
    if(Math.random()<boltChance()){
      const bx = freeX(12, avoid);
      bolts.push({ x:bx, y:-12, hue:HUES[Math.floor(Math.random()*HUES.length)] });
    }
    // 道具（概率随难度降）
    if(Math.random()<puChance()){
      const px = freeX(12, avoid);
      powerups.push({ x:px, y:-12, type:PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)] });
    }
  }

  // ── 输入 ──
  const keys = {};
  window.addEventListener('keydown', e=>{
    if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)) keys[e.key]=true;
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){
      if(state===STATE.PLAY) pause();
      else if(state===STATE.PAUSE) resume();
    }
  });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; });

  let dragId = null, dragX = null;
  cv.addEventListener('pointerdown', e=>{
    dragId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch(_) {}
    dragX = toLogicalX(e.clientX);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', e=>{
    if(dragX!==null && e.pointerId===dragId){
      dragX = toLogicalX(e.clientX);
      e.preventDefault();
    }
  });
  function endDrag(e){
    if(e && e.pointerId!==undefined && e.pointerId!==dragId) return;
    dragX=null; dragId=null;
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  function toLogicalX(clientX){
    const r = cv.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }

  // ── 碰撞 ──
  function aabb(ax,ay,aw,ah, bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  // ── 粒子/飘字/闪光 工具 ──
  function burst(x, y, col, n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=40+Math.random()*70;
      const life=0.4+Math.random()*0.35;
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life, max:life, c:col });
    }
  }
  function pushFloat(x, y, text, color){
    floatTexts.push({ x, y, text, color, life:0.9, max:0.9, vy:-32 });
  }
  const elFlash=document.getElementById('flash');
  function triggerFlash(col){
    elFlash.style.background = col;
    elFlash.classList.remove('dye'); void elFlash.offsetWidth; elFlash.classList.add('dye');
  }

  // ── 更新 ──
  function update(dt){
    elapsed += dt;
    // 气球移动：拖拽绝对跟随（带阻尼）/ 键盘惯性加减速
    if(dragX!==null){
      const prev = balloon.x;
      balloon.x += (dragX - balloon.x) * Math.min(1, dt*13);
      balloon.vx = (balloon.x - prev) / Math.max(dt, 0.001);
    } else {
      let dir=0;
      if(keys['ArrowLeft']||keys['a']||keys['A']) dir-=1;
      if(keys['ArrowRight']||keys['d']||keys['D']) dir+=1;
      balloon.vx += dir * 1500 * dt;                 // 加速
      balloon.vx *= Math.pow(0.0008, dt);            // 摩擦（强阻尼，漂浮感）
      balloon.vx = Math.max(-balloon.speed, Math.min(balloon.speed, balloon.vx));
      balloon.x += balloon.vx * dt;
      if(dir===0 && Math.abs(balloon.vx)<6) balloon.vx=0;
    }
    // 倾斜：跟随水平速度，lerp 平滑
    const targetTilt = Math.max(-0.13, Math.min(0.13, balloon.vx / 1600));
    balloon.tilt += (targetTilt - balloon.tilt) * Math.min(1, dt*8);
    // 软回弹边界
    const minX = balloon.w/2+4, maxX = W-balloon.w/2-4;
    if(balloon.x < minX){ balloon.x = minX; balloon.vx *= -0.3; }
    if(balloon.x > maxX){ balloon.x = maxX; balloon.vx *= -0.3; }
    // 拖尾气流
    if(Math.abs(balloon.vx) > 50 && Math.random() < 0.55){
      particles.push({ x:balloon.x + (Math.random()-0.5)*10, y:balloon.y+balloon.h/2-2,
        vx:-balloon.vx*0.04 + (Math.random()-0.5)*18, vy:18+Math.random()*22,
        life:0.55, max:0.55, c:'rgba(205,222,255,0.7)' });
    }

    if(inv>0) inv -= dt;
    if(fx.slow>0) fx.slow -= dt;
    if(fx.magnet>0) fx.magnet -= dt;
    if(fx.double>0) fx.double -= dt;

    const mul = fx.slow>0 ? 0.5 : 1;
    const v = fallSpeed()*mul;
    const bx = balloon.x - balloon.w/2, by = balloon.y - balloon.h/2;

    // 栅栏
    for(let i=fences.length-1;i>=0;i--){
      const f=fences[i]; f.y += v*dt;
      if(f.y > H+20){ fences.splice(i,1); continue; }
      // 险胜擦边：纵向重叠但水平缝隙 < 10px（每根栅栏仅触发一次）
      if(!f.near && f.y+f.h > by && f.y < by+balloon.h){
        const gap = (bx+balloon.w <= f.x) ? (f.x-(bx+balloon.w)) : ((bx >= f.x+f.w) ? (bx-(f.x+f.w)) : -1);
        if(gap>=0 && gap<10){ f.near=true; score+=5; pushFloat(balloon.x, balloon.y-18, '险 +5', '#ffd23f'); }
      }
      if(aabb(bx,by,balloon.w,balloon.h, f.x,f.y,f.w,f.h)){
        if(inv>0){ // 穿过并碎裂
          for(let k=0;k<8;k++) particles.push({x:f.x+Math.random()*f.w, y:f.y+Math.random()*f.h, vx:(Math.random()-0.5)*120, vy:(Math.random()-0.5)*120, life:0.4, max:0.4, c:'#8a8f9c'});
          fences.splice(i,1);
        } else { gameOver(); return; }
      }
    }
    // 宝石
    for(let i=gems.length-1;i>=0;i--){
      const g=gems[i];
      if(fx.magnet>0 && Math.abs(g.x-balloon.x)<70) g.x += (balloon.x-g.x)*Math.min(1,dt*3);
      g.y += v*dt;
      if(g.y>H+12){ gems.splice(i,1); continue; }
      if(!g.got && aabb(bx,by,balloon.w,balloon.h, g.x-5,g.y-5,10,10)){
        g.got=true;
        const add = (g.type===1?20:10) * (fx.double>0?2:1);
        score += add;
        burst(g.x, g.y, GEMS[g.type], 6);
        pushFloat(g.x, g.y-6, '+'+add, GEMS[g.type]);
        gems.splice(i,1);
      }
    }
    // 闪电
    for(let i=bolts.length-1;i>=0;i--){
      const b=bolts[i]; b.y += v*dt;
      if(b.y>H+14){ bolts.splice(i,1); continue; }
      if(aabb(bx,by,balloon.w,balloon.h, b.x-6,b.y-6,12,12)){
        invColor = b.hue; inv = 4.0;
        burst(b.x, b.y, b.hue, 10);
        pushFloat(b.x, b.y-6, '通电!', b.hue);
        triggerFlash(b.hue);
        bolts.splice(i,1);
      }
    }
    // 道具
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i]; p.y += v*dt;
      if(p.y>H+14){ powerups.splice(i,1); continue; }
      if(aabb(bx,by,balloon.w,balloon.h, p.x-6,p.y-6,12,12)){
        burst(p.x, p.y, PU[p.type].color, 8);
        pushFloat(p.x, p.y-6, PU[p.type].label, PU[p.type].color);
        applyPower(p.type);
        powerups.splice(i,1);
      }
    }
    // 粒子
    for(let i=particles.length-1;i>=0;i--){
      const pt=particles[i];
      pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt;
      if(pt.life<=0) particles.splice(i,1);
    }
    // 飘字
    for(let i=floatTexts.length-1;i>=0;i--){
      const ft=floatTexts[i]; ft.y+=ft.vy*dt; ft.life-=dt;
      if(ft.life<=0) floatTexts.splice(i,1);
    }
    // 生成
    spawnTimer += dt;
    if(spawnTimer >= rowInterval()){ spawnTimer=0; spawnRow(); }
  }

  function applyPower(type){
    if(type==='shield'){ inv = Math.max(inv,5); invColor=null; }
    else if(type==='slow') fx.slow = 5;
    else if(type==='magnet') fx.magnet = 6;
    else if(type==='double') fx.double = 8;
  }

  // ── 渲染 ──
  function render(){
    // 天空
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#243a5e'); g.addColorStop(0.55,'#3a5680'); g.addColorStop(1,'#5a78a0');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // 视差云（远+近）+ 远山
    drawClouds();
    drawMountains();

    // 栅栏
    for(const f of fences) drawFence(f);
    // 宝石（轻微浮动）
    for(const gm of gems){
      const bob = Math.round(Math.sin(elapsed*4 + gm.x*0.1)*1);
      const pal={G:GEMS[gm.type], W:'#ffffff'};
      drawSprite(GEM, pal, gm.x-4, gm.y-4+bob);
    }
    // 闪电
    for(const b of bolts){
      const bob = Math.round(Math.sin(elapsed*5 + b.x*0.1)*1);
      const pal={O:'#15181f', B:b.hue, L:'#fff7c2'};
      drawSprite(BOLT, pal, b.x-5, b.y-5+bob);
    }
    // 道具
    for(const p of powerups){
      const bob = Math.round(Math.sin(elapsed*4 + p.x*0.1)*1);
      const col=PU[p.type].color;
      const pal={O:'#15181f', B:col};
      drawSprite(POWERUP, pal, p.x-5, p.y-5+bob);
    }
    // 粒子
    for(const pt of particles){
      ctx.globalAlpha=Math.max(0,pt.life/(pt.max||0.4));
      ctx.fillStyle=pt.c; ctx.fillRect(Math.round(pt.x),Math.round(pt.y), pt.sz||2, pt.sz||2);
      ctx.globalAlpha=1;
    }
    // 气球
    drawBalloon();
    // 飘字（最上层）
    ctx.textAlign='center';
    for(const ft of floatTexts){
      ctx.globalAlpha = Math.max(0, ft.life/ft.max);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 11px "VT323", monospace';
      ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
    }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }

  let cloudSeed = [ {x:40,y:80,s:1.4,sp:8}, {x:200,y:200,s:1.0,sp:6}, {x:120,y:340,s:1.2,sp:7} ];
  let cloudFar  = [ {x:90,y:60,s:1.0,sp:3}, {x:230,y:260,s:0.9,sp:2.5}, {x:30,y:300,s:1.1,sp:3.2} ];
  function drawClouds(){
    // 远云：更慢更淡
    ctx.fillStyle='rgba(150,170,200,0.16)';
    for(const c of cloudFar){
      const yy = ((c.y + elapsed*c.sp) % (H+60)) - 30;
      ctx.beginPath(); ctx.ellipse(c.x, yy, 52*c.s, 16*c.s, 0, 0, Math.PI*2); ctx.fill();
    }
    // 近云
    ctx.fillStyle='rgba(111,140,176,0.35)';
    for(const c of cloudSeed){
      const yy = ((c.y + elapsed*c.sp) % (H+60)) - 30;
      const w=38*c.s, h=12*c.s;
      ctx.beginPath(); ctx.ellipse(c.x, yy, w, h, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  function drawMountains(){
    // 远山（浅）
    ctx.fillStyle='rgba(40,58,86,0.5)';
    ctx.beginPath();
    const p1=[[0,392],[40,362],[78,388],[124,352],[168,378],[212,348],[270,372],[270,H]];
    ctx.moveTo(p1[0][0],p1[0][1]);
    for(let i=1;i<p1.length;i++) ctx.lineTo(p1[i][0],p1[i][1]);
    ctx.closePath(); ctx.fill();
    // 近山（深）
    ctx.fillStyle='rgba(26,40,62,0.55)';
    ctx.beginPath();
    const p2=[[0,418],[60,400],[120,415],[190,398],[270,412],[270,H]];
    ctx.moveTo(p2[0][0],p2[0][1]);
    for(let i=1;i<p2.length;i++) ctx.lineTo(p2[i][0],p2[i][1]);
    ctx.closePath(); ctx.fill();
  }

  function drawFence(f){
    ctx.fillStyle='#3a3f4f'; ctx.fillRect(f.x, f.y, f.w, f.h);
    ctx.fillStyle='#8a8f9c'; ctx.fillRect(f.x+1, f.y+1, f.w-2, f.h-3);
    ctx.fillStyle='#ff5e5e'; ctx.fillRect(f.x+1, f.y+1, f.w-2, 2);
    ctx.fillStyle='#2a2f3a'; ctx.fillRect(f.x, f.y+f.h-1, f.w, 1);
    // 铆钉
    ctx.fillStyle='#5a5f6c';
    for(let rx=f.x+4; rx<f.x+f.w-3; rx+=8) ctx.fillRect(rx, f.y+f.h-5, 1, 2);
  }

  function drawBalloon(){
    const bw = balloon.w, bh = balloon.h;
    const sway = Math.sin(elapsed*1.8)*0.8;            // 待机摆动
    const ox = balloon.x - bw/2 + sway, oy = balloon.y - bh/2;
    let pal;
    if(invColor){
      pal = { O:'#15181f', T:invColor, S:shade(invColor,0.6), B:'#7a4a2a', R:'#15181f' };
    } else {
      pal = { O:'#15181f', T:'#e8ecf2', S:'#9aa3b2', B:'#7a4a2a', R:'#15181f' };
    }
    ctx.save();
    ctx.translate(balloon.x, balloon.y);
    ctx.rotate(balloon.tilt);
    ctx.translate(-balloon.x, -balloon.y);
    if(inv>0){ ctx.globalAlpha = 0.55 + 0.45*Math.abs(Math.sin(elapsed*22)); }
    drawSprite(BALLOON, pal, ox, oy);
    ctx.globalAlpha = 1;
    // 染色外发光
    if(invColor){
      ctx.globalAlpha=0.5; ctx.shadowColor=invColor; ctx.shadowBlur=10;
      ctx.strokeStyle=invColor; ctx.lineWidth=1;
      ctx.strokeRect(ox-1,oy-1,bw+2,bh+2);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    // 护盾环（无敌但无染色）
    if(inv>0 && !invColor){
      ctx.globalAlpha=0.85; ctx.strokeStyle='#9be7ff'; ctx.lineWidth=1;
      ctx.strokeRect(ox-2,oy-2,bw+4,bh+4); ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  // ── HUD ──
  const elScore=document.getElementById('score');
  const elBest=document.getElementById('best');
  const elEffects=document.getElementById('effects');
  const elLvBar=document.getElementById('levelBar');
  const elLvNum=document.getElementById('lvNum');
  const elLvProg=document.getElementById('lvProg');
  const elMenuBest=document.getElementById('menuBest');
  elMenuBest.textContent = best;
  function pad(n){ return String(n).padStart(6,'0'); }
  function updateHUD(){
    elScore.innerHTML = '<span class="k">SCORE</span><span class="v">'+pad(score)+'</span>';
    elBest.innerHTML = '<span class="k">BEST</span><span class="v">'+Math.max(best, score)+'</span>';
    const lv = level();
    elLvNum.textContent = lv+1;
    elLvProg.style.width = ((score % 200)/200*100).toFixed(1) + '%';
    let html='';
    const chip=(color,label,frac)=>{
      const pct=Math.max(0,Math.min(1,frac))*100;
      return '<div class="chip" style="color:'+color+'"><span class="dot" style="background:'+color+'"></span>'+label+'<span class="bar"><i style="width:'+pct+'%"></i></span></div>';
    };
    if(invColor) html += chip(invColor,'通电', inv/4);
    else if(inv>0) html += chip('#9be7ff','护盾', inv/5);
    if(fx.slow>0)   html += chip(PU.slow.color,'缓降', fx.slow/5);
    if(fx.magnet>0) html += chip(PU.magnet.color,'吸铁', fx.magnet/6);
    if(fx.double>0) html += chip(PU.double.color,'双倍', fx.double/8);
    elEffects.innerHTML = html;
  }

  // ── 主循环 ──
  let last=0;
  function loop(t){
    if(!last) last=t;
    let dt=(t-last)/1000; last=t;
    if(dt>0.05) dt=0.05;
    if(state===STATE.PLAY) update(dt);
    render();
    if(state===STATE.PLAY) updateHUD();
    requestAnimationFrame(loop);
  }

  // ── 流程 ──
  const menu=document.getElementById('menu');
  const pauseEl=document.getElementById('pause');
  const overEl=document.getElementById('over');

  function start(){
    reset(); state=STATE.PLAY; last=0;
    elMenuBest.textContent = best;
    menu.classList.add('hidden'); pauseEl.classList.add('hidden'); overEl.classList.add('hidden');
    elLvBar.classList.add('show');
  }
  function pause(){ if(state!==STATE.PLAY) return; state=STATE.PAUSE; pauseEl.classList.remove('hidden'); }
  function resume(){ if(state!==STATE.PAUSE) return; state=STATE.PLAY; last=0; pauseEl.classList.add('hidden'); }
  function toMenu(){ state=STATE.MENU; pauseEl.classList.add('hidden'); overEl.classList.add('hidden'); menu.classList.remove('hidden'); elLvBar.classList.remove('show'); elMenuBest.textContent = best; floatTexts.length=0; particles.length=0; }
  function gameOver(){
    state=STATE.OVER;
    if(score>best){ best=score; localStorage.setItem('hotAirBalloon.best', String(best)); }
    document.getElementById('finalScore').textContent=score;
    document.getElementById('finalBest').textContent=best;
    overEl.classList.remove('hidden');
    elLvBar.classList.remove('show');
    floatTexts.length=0; particles.length=0;
  }

  document.getElementById('startBtn').onclick=start;
  document.getElementById('againBtn').onclick=start;
  document.getElementById('resumeBtn').onclick=resume;
  document.getElementById('restartBtn1').onclick=start;
  document.getElementById('menuBtn1').onclick=toMenu;
  document.getElementById('menuBtn2').onclick=toMenu;
  document.getElementById('pauseBtn').onclick=()=>{ state===STATE.PLAY?pause():state===STATE.PAUSE?resume():null; };

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
