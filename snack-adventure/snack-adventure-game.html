<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>零食大冒险 · Snack Adventure</title>
<meta name="description" content="竖屏三车道零食跑酷（微信小游戏《9月零食金币狂飙赛》逐像素逆向复刻）：左右换道躲雪糕筒、狂吃金币、捡油桶进入 3 秒双倍速，60 秒限时挑战最高分。键盘 + 触摸双输入。">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1b2430;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#1b2430;}

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<!-- 合集共享模块（localStorage 封装 / Web Audio 单例 / 输入原语）。
     离线或单独拷贝本文件时自动降级到本地实现，不影响游玩。 -->
<script src="../shared.js"></script>
<script>
'use strict';
/* ==========================================================================
   《零食大冒险》  —  竖屏三车道零食跑酷
   单文件 / 无外部依赖 / 全程序化矢量绘制 + WebAudio 合成音效
   全部尺寸依据参考截图逐像素测量得出（详见下方"实测标定"注释）
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. 画布与实测标定参数
   -------------------------------------------------------------------------- */
const H = 1287;                       // 逻辑高度（参考图内容区 640 x 1287，实测）
/* 逻辑宽度按**视口比例动态扩展**（≥640）：原 640 制版不变形、不裁剪，
   多出来的横向空间由「居中的 640 制版 + 铺满的背景」填充 → 手机上满宽、无左右黑边。 */
let   W = 640;
let   XOFF = 0;                       // 640 制版美术在动态宽度下的居中偏移 = (W-640)/2
// 路面几何（对 key_005.jpg 逐行最小二乘拟合，内容坐标系 = 全图 y − 113）：
//   路面半宽  = 0.5875 * (y - 296)    ← 10 行采样拟合，残差 < 2px
//   车道分隔线 = 0.1725 * (y - 285)    ← 6 行采样拟合，残差 < 2px
const Y_VP    = 296;                  // 路面消失点 y（路面/车道线共同外推点）
let   ROAD_CX = 319;                  // 路面中心线 x（实测 311~319.5；随动态宽度重算为 W/2）
const ROAD_K  = 0.5875;               // 路面半宽 = ROAD_K * (y - Y_VP)
const GRASS_TOP = 415;                // 草地（地平线）上边缘 y（实测）

// 透视：z 为世界深度，y = Y_VP + C_Z / z；玩家位于 z = Z_P
// C_Z 由「玩家着地 y = 1058」反解：296 + C_Z/3 = 1058 → C_Z = 2286
const C_Z = 2286, Z_P = 3, PXS = 100;
// 车道中心（实测 t130s/t160s/t250s 三帧角色中心 = 319±218）→ 世界偏移 2.18
const LANE_WU = 2.18;                 // 单车道中心间距（世界单位）
// 车道分隔线：0.1725*(y-285) px ⇒ 世界偏移 = 0.1725 * C_Z/(PXS*Z_P) / 1.0116 ≈ 1.333
const DIVIDER_WU = 1.333;             // 车道分割线相对中心的世界偏移
const PLAYER_Y = 1058;                // 角色轮胎着地 y

const Z_FAR = 18.5, Z_NEAR = 2.28;    // 生成 / 回收深度（对应 y≈420 / y≈1299）

/* ---- 数值参数 ----------------------------------------------------------
   【待确认】= 参考图中没有可直接读取的数值，由相邻帧差分反推或采用合理默认值。
   已由参考图确认的项不带标记（如 3S 加速、60 秒单局）。 */
const ROUND_TIME = 60;                // 单局时长 60 秒（实测倒计时 01:00 → 00:00）
const COIN_SCORE = 20;                // 单枚金币分值 【待确认】由 0→270 分 / ~12 秒实数反推
const BOOST_TIME = 3.0;               // 油桶加速时长 3 秒（参考图明确标注 "3S内分数翻倍"）
const BOOST_MUL  = 2;                 // 加速期分数倍率 2x（参考图明确标注）
const START_SPEED = 5.6;              // 初始推进速度（世界单位/秒）【待确认】
const SPEED_GAIN  = 0.055;            // 每秒加速量【待确认】
/* 音效：参考图为静帧，无法提取音频 → 全部为程序合成（WebAudio），风格【待确认】 */

/* 配色（参考图取色） */
/* 配色全部取自 key_005.jpg 的像素众数（参考图为高饱和扁平风）
   天空 #57D2FE（占 44k 像素，几乎纯色）
   山峦 #08ACE1   树冠 #00D97A   草地 #76D34E
   路面 #8F89A5（纯色，无渐变）  车道线 #ECE6F4 */
const COL = {
  skyTop:'#57D2FE', skyMid:'#57D2FE', skyLow:'#66D8FE',
  cloud:'#FFFFFF',
  mtnFar:'#08ACE1', mtnMid:'#079FD6', mtnNear:'#0693C9',
  grassTop:'#76D34E', grassMid:'#76D34E', grassLow:'#71CE49',
  grassLight:'#8CE459', grassDark:'#5FC845', grassLeaf:'#4FB93A',
  road:'#8F89A5', roadFar:'#8F89A5', roadNear:'#8F89A5',
  shoulder:'#CFD2E0',
  lane:'#ECE6F4',
  treeDark:'#0FA84E', treeMid:'#00D97A', treeLight:'#38E08C', trunk:'#A45B4A',
  fog:'#A9DEEC',
  coneRed:'#E93A2E', coneRedDark:'#C4291F', coneWhite:'#F7F2E6', plate:'#4E4E58',
  coinHi:'#FFE07A', coinMid:'#FFD24A', coinRim:'#EFA417', coinDark:'#E08C0C',
  canBlue:'#5BB8E8', canBlueDark:'#3E97C6', canLight:'#7FCCF2', capGray:'#4C4C55',
  uiShadow:'rgba(45,45,65,0.92)'
};
const FONT = '"Yuanti SC","HanziPen SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif';
const FONT_H = '"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif';

/* --------------------------------------------------------------------------
   2. 画布初始化与自适应
   -------------------------------------------------------------------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VIEW = {s:1, ox:0, oy:0, dpr:1};

function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  // 宽度按视口比例扩展（上限 1120 兜住极端横屏）：满宽且等比、不裁剪
  W = Math.max(640, Math.min(1120, Math.round(H * ww / Math.max(1, wh))));
  XOFF = (W - 640) / 2;
  ROAD_CX = W / 2;
  const s = Math.min(ww/W, wh/H);
  VIEW.s = s;
  VIEW.ox = (ww - W*s)/2;
  VIEW.oy = (wh - H*s)/2;
  cv.style.width  = (W*s)+'px';
  cv.style.height = (H*s)+'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VIEW.dpr = dpr;
  cv.width  = Math.round(W*dpr);
  cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,150));
resize();

/* --------------------------------------------------------------------------
   3. 通用工具
   -------------------------------------------------------------------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const TAU = Math.PI*2;

function rr(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,TAU); c.closePath(); }
function ell(c,x,y,rx,ry,rot){ c.beginPath(); c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU); c.closePath(); }

/** 带描边/阴影的文字 */
function txt(c,s,x,y,size,color,weight,opt){
  opt = opt||{};
  c.save();
  c.font = (weight||'700')+' '+size+'px '+(opt.hf?FONT_H:FONT);
  c.textAlign = opt.align||'center';
  c.textBaseline = opt.baseline||'alphabetic';
  c.lineJoin='round'; c.lineCap='round';
  if(opt.shadow){
    c.shadowColor = opt.shadow; c.shadowBlur = opt.shadowBlur||0;
    c.shadowOffsetY = opt.shadowY||3;
  }
  if(opt.stroke){
    c.lineWidth = opt.sw||Math.max(3,size*0.16);
    c.strokeStyle = opt.stroke;
    c.strokeText(s,x,y);
  }
  if(opt.grad){
    const g = c.createLinearGradient(0,y-size*0.85,0,y+size*0.2);
    opt.grad.forEach((st,i)=>g.addColorStop(i/(opt.grad.length-1), st));
    c.fillStyle = g;
  } else c.fillStyle = color;
  c.fillText(s,x,y);
  c.restore();
}

/** 四角星光点 */
function sparkle(c,x,y,r,color,alpha){
  c.save(); c.globalAlpha=(alpha===undefined?1:alpha); c.fillStyle=color||'#FFF';
  c.beginPath();
  c.moveTo(x,y-r); c.quadraticCurveTo(x,y,x+r,y);
  c.quadraticCurveTo(x,y,x,y+r); c.quadraticCurveTo(x,y,x-r,y);
  c.quadraticCurveTo(x,y,x,y-r); c.closePath(); c.fill(); c.restore();
}

/** 离屏精灵缓存 */
function sprite(w,h,fn){
  const cc = document.createElement('canvas');
  cc.width = w; cc.height = h;
  const g = cc.getContext('2d');
  fn(g,w,h);
  return cc;
}

/* --------------------------------------------------------------------------
   4. 音效（WebAudio 合成，无外部资源）
   -------------------------------------------------------------------------- */
let AC=null, muted=false;
// 优先复用 shared.js 的全局 AudioContext 单例：同一页面切换多个游戏时不再各开一个 AC。
// 拿不到 SharedGame（离线单文件、或直接拷贝本文件）时，完整降级到本地实现。
function sharedAudio(){ const S=window.SharedGame; return (S&&S.Audio)?S.Audio:null; }
function audioInit(){
  const S = sharedAudio();
  if(S){ S.ensure(); if(S.ctx) AC = S.ctx; if(AC) return; }
  if(AC) return;
  try{
    const Ctor = window.AudioContext||window.webkitAudioContext;
    if(Ctor) AC = new Ctor();
  }catch(e){ AC=null; }
}
function setMuted(v){
  muted = !!v;
  const S = sharedAudio();
  if(S) S.setEnabled(!muted);      // 与共享模块的静音开关保持一致
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(muted) return;
  // 委托给共享音频：SharedGame.Audio.tone(type, f0, f1, dur, vol, delay)
  const S = sharedAudio();
  if(S && S.ctx){ S.tone(type||'sine', freq, slideTo||freq, dur, vol||0.10, delay||0); return; }
  if(!AC) return;
  try{
    const t0 = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.10,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
const sfx = {
  coin(){ tone(1250,0.075,'triangle',0.085,1700); tone(1900,0.05,'sine',0.04,2300,0.02); },
  boost(){ tone(560,0.13,'square',0.075,900); tone(900,0.20,'square',0.075,1350,0.09); },
  crash(){ tone(260,0.42,'sawtooth',0.16,50); tone(95,0.5,'square',0.11,38); },
  click(){ tone(780,0.055,'sine',0.075,1020); },
  over(){ tone(540,0.16,'sine',0.10,400); tone(380,0.30,'sine',0.10,220,0.15); },
  tick(){ tone(880,0.10,'sine',0.09,880); },
  go(){ tone(1180,0.22,'sine',0.11,1560); }
};

/* --------------------------------------------------------------------------
   5. 透视投影
   -------------------------------------------------------------------------- */
const gY  = z => Y_VP + C_Z/z;          // 地面 y
const sZ  = z => Z_P/z;                 // 缩放因子（z=Z_P 时为 1）
const pX  = (wx,z) => ROAD_CX + wx*PXS*sZ(z);
const laneX = lane => (lane-1)*LANE_WU;  // lane: 0 左 / 1 中 / 2 右
/** 路面半宽（屏幕像素），与实测公式一致 */
const halfW = y => Math.max(0, ROAD_K*(y-Y_VP));

/* ==========================================================================
   6. 精灵资源（全部程序化绘制，绘制一次后复用）
   ========================================================================== */

/* ---- 云 ---- */
const CLOUD = [0,1,2].map(i => sprite(220,120,(g,w,h)=>{
  const cx=w/2, cy=h*0.62, R=34+i*3;
  g.fillStyle='#FFFFFF';
  const blobs=[[0,0,R],[0.52,-0.18,R*0.78],[-0.5,0.05,R*0.72],[0.18,-0.5,R*0.66],[-0.2,-0.36,R*0.58]];
  g.beginPath();
  blobs.forEach(b=>{ g.moveTo(cx+b[0]*R+ b[2], cy+b[1]*R); g.arc(cx+b[0]*R, cy+b[1]*R, b[2], 0, TAU); });
  g.fill();
  // 底部略平的柔边
  g.beginPath(); g.ellipse(cx, cy+R*0.42, R*1.5, R*0.42, 0, 0, TAU); g.fill();
}));

/* ---- 树（针叶+圆润树冠，参考图：深绿主体+浅绿高光+棕色树干）---- */
const TREE = sprite(240,320,(g,w,h)=>{
  const cx=w/2, base=h-6;
  // 树干
  g.fillStyle=COL.trunk;
  g.beginPath();
  g.moveTo(cx-13,base); g.lineTo(cx+13,base);
  g.lineTo(cx+8,base-96); g.lineTo(cx-8,base-96); g.closePath(); g.fill();
  g.fillStyle='rgba(120,40,25,0.35)';
  g.beginPath(); g.moveTo(cx-13,base); g.lineTo(cx-4,base); g.lineTo(cx-2,base-96); g.lineTo(cx-8,base-96); g.closePath(); g.fill();
  // 树冠：三层堆叠的圆润三角
  const layers=[[0,-96,86,72],[0,-160,70,60],[0,-218,50,46]];
  layers.forEach((L,i)=>{
    const [ox,oy,rw,rh]=L;
    g.fillStyle = i===0?COL.treeDark:(i===1?COL.treeMid:'#25B863');
    g.beginPath();
    g.moveTo(cx+ox, base+oy);
    g.bezierCurveTo(cx+ox+rw*0.55, base+oy+rh*0.15, cx+ox+rw*0.82, base+oy+rh*0.72, cx+ox+rw*0.62, base+oy+rh*0.92);
    g.bezierCurveTo(cx+ox+rw*0.30, base+oy+rh*1.02, cx+ox-rw*0.30, base+oy+rh*1.02, cx+ox-rw*0.62, base+oy+rh*0.92);
    g.bezierCurveTo(cx+ox-rw*0.82, base+oy+rh*0.72, cx+ox-rw*0.55, base+oy+rh*0.15, cx+ox, base+oy);
    g.closePath(); g.fill();
  });
  // 高光
  g.fillStyle=COL.treeLight;
  g.beginPath();
  g.moveTo(cx-2,base-206);
  g.bezierCurveTo(cx-26,base-186, cx-36,base-158, cx-30,base-142);
  g.bezierCurveTo(cx-16,base-152, cx-8,base-178, cx-2,base-206);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(cx-4,base-120);
  g.bezierCurveTo(cx-40,base-104, cx-52,base-66, cx-44,base-44);
  g.bezierCurveTo(cx-22,base-58, cx-8,base-90, cx-4,base-120);
  g.closePath(); g.fill();
  // 叶簇细节
  g.fillStyle='rgba(9,120,52,0.30)';
  [[-20,-58,5],[16,-74,4.5],[-32,-90,4],[26,-108,4],[-14,-140,3.6],[10,-160,3.4],[0,-196,3]].forEach(d=>{
    g.beginPath(); g.arc(cx+d[0], base+d[1], d[2], 0, TAU); g.fill();
  });
});

/* ---- 金币 ---- */
const COIN = sprite(120,120,(g,w,h)=>{
  const cx=w/2, cy=h/2, R=44;
  g.fillStyle=COL.coinRim; circ(g,cx,cy,R); g.fill();
  const grd = g.createRadialGradient(cx-14,cy-16,4,cx,cy,R*1.05);
  grd.addColorStop(0,COL.coinHi); grd.addColorStop(0.55,COL.coinMid); grd.addColorStop(1,'#F0A61E');
  g.fillStyle=grd; circ(g,cx,cy,R-3); g.fill();
  // 右侧暗弧（体现 3/4 侧面）
  g.save(); circ(g,cx,cy,R); g.clip();
  g.beginPath(); g.arc(cx,cy,R*1.06,-Math.PI/2.35,Math.PI/2.35,false);
  g.arc(cx-16,cy,R*1.06,Math.PI/2.35,-Math.PI/2.35,true); g.closePath();
  g.fillStyle=COL.coinDark; g.fill(); g.restore();
  // 内面
  g.fillStyle='#FFDE6E'; circ(g,cx-3,cy,R*0.70); g.fill();
  // ¥ 符号
  g.save();
  g.font='700 44px '+FONT; g.textAlign='center'; g.textBaseline='middle';
  g.lineJoin='round'; g.lineWidth=5; g.strokeStyle='#E79A16';
  g.strokeText('¥',cx-3,cy+1);
  g.fillStyle='#FFF7D2'; g.fillText('¥',cx-3,cy+1);
  g.restore();
  // 高光
  g.save(); g.globalAlpha=0.8; g.translate(cx-16,cy-22); g.rotate(-0.45);
  ell(g,0,0,12,6); g.fillStyle='#FFFFFF'; g.fill(); g.restore();
  g.lineWidth=3; g.strokeStyle='rgba(196,120,10,0.55)'; circ(g,cx,cy,R-1.5); g.stroke();
});

/* ---- 路障（红白锥 + 深灰菱形底座）---- */
const CONE = sprite(200,190,(g,w,h)=>{
  const cx=w/2, base=h-14;
  // 地面阴影
  g.globalAlpha=0.22; g.fillStyle='#33254F';
  ell(g,cx,base+6,62,14); g.fill(); g.globalAlpha=1;
  // 底座菱形
  const dia=(y0,sc,f)=>{ g.beginPath();
    g.moveTo(cx, y0-26*sc); g.quadraticCurveTo(cx+62*sc, y0, cx, y0+26*sc);
    g.quadraticCurveTo(cx-62*sc, y0, cx, y0-26*sc); g.closePath(); g.fillStyle=f; g.fill(); };
  dia(base-14,1,'#3F3F49'); dia(base-20,1,COL.plate);
  g.beginPath();
  g.moveTo(cx, base-46); g.quadraticCurveTo(cx+52, base-22, cx, base); g.quadraticCurveTo(cx-52, base-22, cx, base-46);
  g.closePath(); g.fillStyle='#66666F'; g.fill();
  // 锥体
  const topY = base-152;
  g.beginPath();
  g.moveTo(cx, topY);
  g.bezierCurveTo(cx+30, topY+52, cx+42, base-70, cx+44, base-24);
  g.quadraticCurveTo(cx, base-6, cx-44, base-24);
  g.bezierCurveTo(cx-42, base-70, cx-30, topY+52, cx, topY);
  g.closePath();
  const cg = g.createLinearGradient(cx-44,0,cx+44,0);
  cg.addColorStop(0,'#F5564A'); cg.addColorStop(0.35,COL.coneRed); cg.addColorStop(1,COL.coneRedDark);
  g.fillStyle=cg; g.fill();
  // 白色反光带（随锥体收窄）
  const band=(y,hh)=>{
    const t=(y-topY)/(base-topY);
    const hw = 44*Math.pow(t,0.62);
    const t2=(y+hh-topY)/(base-topY);
    const hw2 = 44*Math.pow(t2,0.62);
    g.beginPath();
    g.moveTo(cx-hw,y); g.lineTo(cx+hw,y); g.lineTo(cx+hw2,y+hh); g.lineTo(cx-hw2,y+hh);
    g.closePath(); g.fillStyle=COL.coneWhite; g.fill();
  };
  band(base-34,15); band(base-66,14);
  g.beginPath();
  g.moveTo(cx, topY);
  g.bezierCurveTo(cx+30, topY+52, cx+42, base-70, cx+44, base-24);
  g.quadraticCurveTo(cx, base-6, cx-44, base-24);
  g.bezierCurveTo(cx-42, base-70, cx-30, topY+52, cx, topY);
  g.closePath();

function ridgePath(pts, base){

}
function drawMountains(){

/* 路边零食道具：按 z 推进，左右交替 */
const sideProps = [];
/* 路宽（世界单位）= ROAD_K*C_Z/(PXS*Z_P) = 4.02 → 道具贴路缘放置：
   wx 取 4.3~4.8，即紧贴白色边线外侧（参考图中零食堆几乎压住路肩） */
const ROAD_HALF_WU = ROAD_K*C_Z/(PXS*Z_P);
const PROP_SEQ = [
  {n:'bush',     side:-1, sc:1.55}, {n:'sundae',  side: 1, sc:1.65},
  {n:'cakeSlice',side:-1, sc:1.75}, {n:'cup',     side: 1, sc:1.70},
  {n:'macaron',  side:-1, sc:1.45}, {n:'bush',    side: 1, sc:1.50},
  {n:'signHXL',  side:-1, sc:1.60}, {n:'donut',   side: 1, sc:1.50},
  {n:'mascot',   side:-1, sc:1.45}, {n:'cookie',  side: 1, sc:1.45},
  {n:'gift',     side:-1, sc:1.45}, {n:'sundae',  side: 1, sc:1.55},
  {n:'lolli',    side:-1, sc:1.45}, {n:'cakeSlice',side: 1, sc:1.65},
  {n:'bush',     side:-1, sc:1.50}, {n:'macaron', side: 1, sc:1.40}
];
let propCursor = 0;
function spawnProp(z){
  const d = PROP_SEQ[propCursor % PROP_SEQ.length];
  propCursor++;
  sideProps.push({ z:z, n:d.n, side:d.side, sc:d.sc,
                   wx:d.side*(ROAD_HALF_WU+0.28+rnd(0,0.42)) });
}
function initProps(){ sideProps.length=0; propCursor=0;
  for(let i=0;i<14;i++){ spawnProp(Z_NEAR+0.8+i*1.42); } }
function drawSideProps(dt, speed){
  for(let i=sideProps.length-1;i>=0;i--){
    const p = sideProps[i];
    p.z -= speed*dt;
    if(p.z < Z_NEAR){ sideProps.splice(i,1); continue; }
    const s = sZ(p.z);
    const y = gY(p.z);
    if(y<GRASS_TOP-6) continue;
    const img = PROPS[p.n];
    const scale = p.sc*s;
    const w = img.width*scale, h = img.height*scale;
    let x = pX(p.wx, p.z);
    // 左侧道具锚点在右侧、右侧道具锚点在左侧，使道具压住路肩（参考图效果）
    const ax = p.side<0 ? x - w*0.14 : x + w*0.14;
    const alpha = clamp((y-GRASS_TOP)/40,0,1);
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.drawImage(img, ax-w/2, y-h+8, w, h);
    ctx.restore();
  }
  while(sideProps.length<14){
    const zs = sideProps.map(q=>q.z);
    spawnProp(zs.length? Math.max(...zs)+1.42 : Z_FAR);
  }
}

/* 路面 + 车道线 + 路肩 + 远端白雾 */
function drawRoad(){
  const y0 = GRASS_TOP-3, y1 = H+2;      // 路面自草地地平线起（参考图中路面顶点被地平线遮挡）
  const h0 = halfW(y0), h1 = halfW(y1);
  // 路面主体：参考图为单一纯色 #8F89A5，不加渐变
  ctx.fillStyle = COL.road;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX-h0,y0); ctx.lineTo(ROAD_CX+h0,y0);
  ctx.lineTo(ROAD_CX+h1,y1); ctx.lineTo(ROAD_CX-h1,y1); ctx.closePath(); ctx.fill();
  // 注：参考图路面无可见纹理/条纹，此处刻意不绘制任何噪点或放射线
  // 路肩：参考图中路缘仅有约 1% 宽度的浅色过渡，不绘制明显灰带
  const sh = (sgn)=>{
    const wT = Math.max(1.0,h0*0.012), wB = Math.max(2.5,h1*0.012);
    ctx.fillStyle=COL.shoulder;
    ctx.beginPath();
    ctx.moveTo(ROAD_CX+sgn*h0, y0);
    ctx.lineTo(ROAD_CX+sgn*(h0+wT), y0);
    ctx.lineTo(ROAD_CX+sgn*(h1+wB), y1);
    ctx.lineTo(ROAD_CX+sgn*h1, y1);
    ctx.closePath(); ctx.fill();
  };
  sh(-1); sh(1);
}

/* 车道线：在世界 z 空间铺虚线，透视自然收缩（实测近处长、远处短） */
const DASH_LEN = 1.02, DASH_GAP = 0.92;
function drawLanes(scrollZ){
  const period = DASH_LEN+DASH_GAP;
  // 两条分割线位于 ±hw/3
  for(let k=0;k<2;k++){
    const wx = (k===0? -1: 1) * DIVIDER_WU;   // 车道分割线：路宽的 1/6 处
    const base = scrollZ % period;
    let z = Z_NEAR - base;
    for(let i=0;i<44;i++, z+=period){
      const z0 = z, z1 = z+DASH_LEN;
      if(z1 < Z_NEAR) continue;
      if(z0 > Z_FAR) break;
      const a0 = Math.max(z0,Z_NEAR), a1 = Math.min(z1, Z_FAR);
      const gA = gY(a0), gB = gY(a1);
      if(Math.abs(gB-gA) < 0.8) continue;          // 注：gY 随 z 递减，必须取绝对值
      if((gA>H+60 && gB>H+60) || (gA<GRASS_TOP-2 && gB<GRASS_TOP-2)) continue;
      const wA = Math.max(1.4, halfW(gA)*0.067), wB = Math.max(1.4, halfW(gB)*0.067);
      const xA = pX(wx, a0), xB = pX(wx, a1);
      ctx.beginPath();
      ctx.moveTo(xA-wA/2, gA); ctx.lineTo(xA+wA/2, gA);
      ctx.lineTo(xB+wB/2, gB); ctx.lineTo(xB-wB/2, gB);
      ctx.closePath();
      ctx.fillStyle=COL.lane; ctx.fill();
    }
  }
  // 路缘实线（沿路两侧，参考图中可见的白色边线）
  const yT = GRASS_TOP-2, yB = H+2;
  [-1,1].forEach(sgn=>{
    const xT = ROAD_CX + sgn*halfW(yT), xB = ROAD_CX + sgn*halfW(yB);
    const wT = Math.max(1.6, halfW(yT)*0.055), wB = Math.max(3, halfW(yB)*0.055);
    ctx.beginPath();
    ctx.moveTo(xT-wT/2, yT); ctx.lineTo(xT+wT/2, yT);
    ctx.lineTo(xB+wB/2, yB); ctx.lineTo(xB-wB/2, yB);
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fill();
  });
}

/* ==========================================================================
   9. 角色（白蛋身体 + 红描边 + 黄色外套 + 红裙 + 黑轮）
   实测：总宽 270、总高 266、着地点 y=1058
   ========================================================================== */
function drawRacer(cx, gy, t, boostOn, tilt, mood){
  ctx.save();
  ctx.translate(cx, gy);
  if(tilt) ctx.rotate(tilt);
  const run = t*13;
  const bob = Math.sin(run*2)*3.0;

  // 地面阴影
  ctx.save();
  ctx.globalAlpha=0.20; ctx.fillStyle='#2A2050';
  ell(ctx,0,6,104,20); ctx.fill(); ctx.restore();

  // 加速光环
  if(boostOn){
    ctx.save();
    const pulse = 0.60+0.30*Math.sin(t*15);
    ctx.globalAlpha=pulse;
    ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=9;
    ctx.shadowColor='rgba(255,214,80,0.95)'; ctx.shadowBlur=26;
    ell(ctx,0,-108,152,64); ctx.stroke();
    ctx.globalAlpha=pulse*0.5; ctx.strokeStyle='#FFE066'; ctx.lineWidth=4;
    ell(ctx,0,-108,172,74); ctx.stroke();
    ctx.restore();
    // 环绕星星
    for(let i=0;i<6;i++){
      const a = t*3.2 + i*TAU/6;
      const px = Math.cos(a)*140, py = -108 + Math.sin(a)*58;
      const sc = 0.55+0.45*Math.abs(Math.sin(a));
      ctx.save(); ctx.globalAlpha=0.9; ctx.translate(px,py); ctx.scale(sc,sc);
      ctx.drawImage(FLARE,-26,-26,52,52); ctx.restore();
    }
  }

  ctx.translate(0, bob);

  /* 车轮 —— 实测参考图车体总宽 185px、轮外缘 ±93px（本函数整体 ×0.92） */
  const wheel=(wx)=>{
    ctx.fillStyle='#2B2B33';
    rr(ctx,wx-35,-78,70,78,17); ctx.fill();
    ctx.fillStyle='#45454F';
    rr(ctx,wx-29,-74,58,24,12); ctx.fill();
    ctx.fillStyle='#5A5A66';
    rr(ctx,wx-22,-69,18,9,4.5); ctx.fill();
  };
  wheel(-68); wheel(68);

  // 红色底盘/裙边
  ctx.fillStyle='#D93A30';
  ell(ctx,0,-42,94,32); ctx.fill();
  ctx.fillStyle='#F2453A';
  ell(ctx,0,-46,90,30); ctx.fill();

  // 黄色外套主体（实测车身段高 120px）
  ctx.fillStyle='#F0A81C';
  ell(ctx,0,-96,88,56); ctx.fill();
  ctx.fillStyle='#FFC02E';
  ell(ctx,0,-100,86,53); ctx.fill();
  // 顶部红色领口（横带）
  ctx.fillStyle='#E5382B';
  ell(ctx,0,-136,68,22); ctx.fill();
  // 领口下方的红色 V
  ctx.fillStyle='#E5382B';
  ctx.beginPath(); ctx.moveTo(-19,-134); ctx.lineTo(19,-134); ctx.lineTo(0,-98); ctx.closePath(); ctx.fill();
  // 高光
  ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='#FFE066';
  ell(ctx,-36,-112,32,17,-0.22); ctx.fill(); ctx.restore();
  // 两侧黄色手
  ctx.fillStyle='#F0A81C';
  ell(ctx,-84,-94,23,23); ctx.fill(); ell(ctx,84,-94,23,23); ctx.fill();
  ctx.fillStyle='#FFD84D';
  ell(ctx,-84,-96,20,20); ctx.fill(); ell(ctx,84,-96,20,20); ctx.fill();
  ctx.fillStyle='#FFE9A0';
  ell(ctx,-88,-101,7,6); ctx.fill(); ell(ctx,80,-101,7,6); ctx.fill();
  // 白色拉链条
  ctx.fillStyle='#FFFBE8';
  [-14,0,14].forEach(x=>{ rr(ctx,x-3.6,-86,7.2,36,3.6); ctx.fill(); });
  // 纽扣
  ctx.fillStyle='#FFE066'; ctx.strokeStyle='#E8951A'; ctx.lineWidth=2.4;
  [[-52,-74],[52,-74]].forEach(p=>{ circ(ctx,p[0],p[1],9); ctx.fill(); ctx.stroke(); });

  /* 头部整体上移 33（车身加高后保持头身比例）：
     实测参考图头段高 140px、车身段高 120px，顶点 y=790、着地 y=1050。 */
  ctx.save();
  ctx.translate(0,-33);
  /* 头部：宽圆顶「双峰」轮廓
     实测参考图头部 190(w) × 176(h)，顶部为左右两个圆峰，中央有浅凹。 */
  ctx.beginPath();
  ctx.moveTo(0,-248);                                   // 中央浅凹（仅下沉 12）
  ctx.bezierCurveTo(-24,-264, -62,-266, -82,-236);      // 左峰外缘
  ctx.bezierCurveTo(-98,-212, -99,-192, -97,-168);      // 左侧最宽
  ctx.bezierCurveTo(-95,-122, -68,-86, -34,-86);        // 左下收口
  ctx.lineTo(34,-86);

  ctx.bezierCurveTo(99,-192, 98,-212, 82,-236);         // 右侧最宽
  ctx.bezierCurveTo(62,-266, 24,-264, 0,-248);          // 右峰外缘
  ctx.closePath();
  ctx.fillStyle='#FFFFFF'; ctx.fill();

  /* 眼睛：浅蓝「叶片」，各占一个圆峰，参考图中两片叶几乎填满峰内 */
  const eye=(sgn)=>{
    ctx.save();
    ctx.translate(sgn*46,-204);
    ctx.rotate(sgn*0.09);
    ctx.beginPath();
    ctx.moveTo(0,-36);                                   // 圆顶（上）
    ctx.bezierCurveTo(sgn*32,-36, sgn*36,-6,  sgn*24,14);
    ctx.bezierCurveTo(sgn*16,26,  sgn*6,30,   0,30);     // 下尖

    ctx.fillStyle='#A9E2F6'; ctx.fill();

    ctx.restore();
  };
  eye(-1); eye(1);
  // 眉心红色竖线（自中央凹口向下，参考图中分界双眼）
  ctx.strokeStyle='#D8352E'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-244); ctx.lineTo(0,-212); ctx.stroke();

  /* 正面表情（仅封面使用）：参考图中角色正对镜头，张嘴大喊 */

    ctx.translate(-72,-208); ctx.rotate(-0.35);
    ctx.fillStyle='#FFC22E';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-34,-19); ctx.lineTo(-34,19); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(34,-19); ctx.lineTo(34,19); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFD95E';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-30,-15); ctx.lineTo(-30,15); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#F0A81C'; circ(ctx,0,0,9); ctx.fill();
    ctx.restore();
    // 大张的嘴（参考图：面部下缘为鲜红张口、内腔深红、底部浅粉舌头）
    ctx.beginPath(); ctx.ellipse(0,-126,50,29,0,0,TAU);
    ctx.fillStyle='#FFFFFF'; ctx.fill();
    ctx.lineWidth=7; ctx.strokeStyle='#D8352E'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-128,41,22,0,0,TAU);
    ctx.fillStyle='#E8332A'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-134,32,14,0,0,TAU);
    ctx.fillStyle='#B31C15'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-108,22,10,0,0,TAU);
    ctx.fillStyle='#F4796B'; ctx.fill();
    // 高光
    ctx.save(); ctx.globalAlpha=0.42; ctx.fillStyle='#FFFFFF';
    ell(ctx,-18,-132,15,6,-0.32); ctx.fill(); ctx.restore();
    // 左上冷汗/闪光
    ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle='#A9E2F6';
    ctx.beginPath();
    ctx.moveTo(-48,-268);
    ctx.bezierCurveTo(-36,-258,-32,-248,-40,-242);
    ctx.bezierCurveTo(-52,-244,-56,-258,-48,-268);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#D8352E'; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();   // 结束头部整体上移 33 的变换

  // 摩擦粉尘（轮下白色小团 + 星点）
  const dust = [[-88,4,15],[-64,12,11],[80,6,14],[58,14,10],[-100,14,9],[92,16,9]];
  dust.forEach((d,i)=>{
    const wob = Math.sin(t*20+i*1.7)*2.4;
    const r = d[2]*(0.75+0.28*Math.abs(Math.sin(t*16+i)));
    ctx.save(); ctx.globalAlpha=0.72;
    ctx.fillStyle='#FFFFFF';
    circ(ctx,d[0]+wob, d[1]+Math.sin(t*14+i)*1.6, r); ctx.fill();
    ctx.globalAlpha=0.35;
    circ(ctx,d[0]+wob+3, d[1]+3, r*0.6); ctx.fill();
    ctx.restore();
  });
  sparkle(ctx,-118,-2,7,'#FFFFFF',0.8+0.2*Math.sin(t*22));
  sparkle(ctx,118,0,6,'#FFFFFF',0.7+0.3*Math.sin(t*18+1));
  ctx.restore();
}

/* ==========================================================================
   10. 游戏实体
   ========================================================================== */
let items = [];          // 金币 / 油桶 / 路障
let particles = [];
let scrollZ = 0;         // 世界滚动累计（用于车道虚线相位）

function spawnItems(){
  items.length = 0;
  let z = Z_FAR;
  for(let i=0;i<14;i++){
    const r = Math.random();
    const lanes = [0,1,2];
    if(r<0.62){
      // 金币串（同一车道 3~5 枚）
      const ln = lanes[rndi(0,2)];
      const n = rndi(3,5);
      for(let k=0;k<n;k++) items.push({type:'coin', lane:ln, z:z+k*1.15, dead:false});
      z += n*1.15 + rnd(1.3,2.4);
    } else if(r<0.82){
      items.push({type:'cone', lane:lanes[rndi(0,2)], z:z, dead:false});
      z += rnd(2.6,4.2);
    } else {
      items.push({type:'can', lane:lanes[rndi(0,2)], z:z, dead:false});
      z += rnd(2.4,3.6);
    }
  }
  // 避免同一 z（±0.6）同时出现 3 条车道障碍，保证可通过
  const byZ = {};
  items.forEach(it=>{ const k = Math.round(it.z); (byZ[k]=byZ[k]||[]).push(it); });
  Object.keys(byZ).forEach(k=>{
    const g = byZ[k].filter(o=>o.type==='cone');
    if(g.length>=3) g[2].type='coin';
  });
}

/* ==========================================================================
   11. 游戏状态机
   ========================================================================== */
const ST = {LOAD:'load', START:'start', RULES:'rules', TUTOR:'tutor', COUNT:'count',
            PLAY:'play', PAUSE:'pause', OVER:'over', RESULT:'result', RANK:'rank', PRIZE:'prize'};
let state = ST.LOAD;
let stateT = 0;

const G = {
  score:0, best:0, lane:1, px:0, tLane:1, tilt:0,
  timeLeft:ROUND_TIME, speed:START_SPEED,
  boost:0, hits:0, countdown:3.6,   // 开局倒计时 3.6s（依次显示 3→2→1）【待确认：参考图仅见到 "1"】
  overReason:'crash',
  reward:null, rank:0, newBest:false,
  flash:0, shake:0, dim:0
};
/* 最高分持久化：优先走 shared.js 的 Store（JSON + 容错封装，跨游戏统一），
   拿不到 SharedGame 时降级为裸 localStorage。键名沿用 snack_run_best，与旧存档兼容。 */
const BEST_KEY = 'snack_run_best';
G.best = (function(){
  try{
    const S = window.SharedGame;
    const raw = (S && S.Store) ? S.Store.get(BEST_KEY, '0') : localStorage.getItem(BEST_KEY);
    return parseInt(raw || '0', 10) || 0;
  }catch(e){ return 0; }
})();

function resetRun(){
  G.score=0; G.lane=1; G.tLane=1; G.tilt=0; G.px=0;
  G.timeLeft=ROUND_TIME; G.speed=START_SPEED;
  G.boost=0; G.hits=0; G.countdown=3.6; G.overReason='crash';
  G.flash=0; G.shake=0;
  scrollZ=0; particles.length=0;
  items.length=0;
  initProps();
  spawnItems();
}

/* 初始态：先把道具铺满屏幕，便于直接看到完整场景 */
resetRun();

/* 奖励档位【待确认：参考图仅示 1860 分 → 4元券】 */
function rewardFor(score){
  if(score>=1800) return {amount:4, label:'4元券游戏'};
  if(score>=1200) return {amount:2, label:'2元券游戏'};
  if(score>=600)  return {amount:1, label:'1元券游戏'};
  return {amount:0, label:'参与奖 · 再来一局'};
}
/* 排名推算【待确认：参考图 1860 分 → 排名 1620】 */
function rankFor(score){
  return Math.max(1, Math.round(4000 - 1.28*score));
}

/* ==========================================================================
   12. 交互
   ========================================================================== */
let hits = [];
const hitRect=(x,y,w,h,fn)=>hits.push({k:'r',x,y,w,h,fn});
const hitCirc=(x,y,r,fn)=>hits.push({k:'c',x,y,r,fn});
function hitTest(lx,ly){
  for(let i=hits.length-1;i>=0;i--){
    const h=hits[i];
    if(h.k==='r'){ if(lx>=h.x&&lx<=h.x+h.w&&ly>=h.y&&ly<=h.y+h.h) return h; }
    else { const dx=lx-h.x, dy=ly-h.y; if(dx*dx+dy*dy<=h.r*h.r) return h; }
  }
  return null;
}
function toLocal(ev){
  const r = cv.getBoundingClientRect();
  const cx = (ev.touches? ev.touches[0].clientX : ev.clientX);
  const cy = (ev.touches? ev.touches[0].clientY : ev.clientY);
  // 减去 XOFF：换算到「640 制版」坐标系，使所有 hit 区域与画面一一对应
  return { x:(cx-r.left)/r.width*W - XOFF, y:(cy-r.top)/r.height*H };
}
function moveLane(dir){
  audioInit();
  if(state!==ST.PLAY) return;
  const nl = clamp(G.lane+dir,0,2);
  if(nl!==G.lane){ G.lane=nl; G.tilt = dir*0.075; sfx.click(); }
}
function startCountdown(){
  audioInit();
  resetRun();
  state = ST.COUNT; stateT = 0;
}
function beginPlay(){ state = ST.PLAY; stateT = 0; }
function endRun(reason){
  G.overReason = reason;
  G.newBest = G.score > G.best;
  if(G.newBest) G.best = G.score;
  try{
    const S = window.SharedGame;
    if(S && S.Store) S.Store.set(BEST_KEY, String(G.best));
    else localStorage.setItem(BEST_KEY, String(G.best));
  }catch(e){}
  G.rank = rankFor(G.score);
  G.reward = rewardFor(G.score);
  state = ST.OVER; stateT = 0;
  sfx.over();
}

let touchStart = null;
function onDown(ev){
  ev.preventDefault();
  const p = toLocal(ev);
  const h = hitTest(p.x,p.y);
  if(h){ audioInit(); h.fn(); return; }
  if(state===ST.PLAY){
    // 屏幕左/右半区点击亦可移动（参考图以左右按钮为主，触屏常规做法）
    // p 已在 640 制版坐标系内，中心恒为 320
    if(p.x < 320) moveLane(-1); else moveLane(1);
  }
  touchStart = p;
}
function onUp(ev){
  if(touchStart && state===ST.PLAY){
    const p = toLocal(ev.changedTouches? {clientX:ev.changedTouches[0].clientX,clientY:ev.changedTouches[0].clientY} : ev);
    const dx = p.x-touchStart.x, dy = p.y-touchStart.y;
    if(Math.abs(dx)>46 && Math.abs(dx)>Math.abs(dy)) moveLane(dx>0?1:-1);
  }
  touchStart = null;
}
cv.addEventListener('mousedown', onDown);
cv.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchend', onUp, {passive:false});
window.addEventListener('keydown', e=>{
  audioInit();
  const k = e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){ moveLane(-1); e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ moveLane(1); e.preventDefault(); }
  else if(k==='Enter'||k===' '){
    e.preventDefault();
    if(state===ST.START) startCountdown();
    else if(state===ST.OVER){ state=ST.RESULT; stateT=0; }
    else if(state===ST.RESULT||state===ST.RANK||state===ST.PRIZE){ state=ST.START; stateT=0; }
    else if(state===ST.RULES||state===ST.TUTOR){ state=ST.START; stateT=0; }
  }
  else if(k==='Escape'){
    if(state===ST.PLAY){ state=ST.PAUSE; stateT=0; }
    else if(state===ST.PAUSE){ state=ST.PLAY; }
  }
  else if(k==='m'||k==='M'){ setMuted(!muted); }
});

/* ==========================================================================
   13. 更新
   ========================================================================== */
function update(dt){
  stateT += dt;
  G.flash = Math.max(0, G.flash-dt*4);
  G.shake = Math.max(0, G.shake-dt*6);
  particles.forEach(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=p.vr*dt; });
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);

  if(state===ST.LOAD){
    if(stateT>0.9){ state=ST.START; stateT=0; }
    return;
  }
  if(state===ST.COUNT){
    const prev = G.countdown;
    G.countdown -= dt;
    if(Math.ceil(prev)!==Math.ceil(G.countdown) && G.countdown>0) sfx.tick();
    if(G.countdown<=0){ sfx.go(); beginPlay(); }
    // 倒计时期间场景缓慢滚动（道具推进统一在 drawScene 中处理）
    scrollZ += 0.6*dt;
    return;
  }
  if(state!==ST.PLAY){
    // 非游戏态：背景缓慢滚动以保持画面生动
    scrollZ += 0.8*dt;
    return;
  }

  // ---- 进行中 ----
  G.speed = START_SPEED + (ROUND_TIME-G.timeLeft)*SPEED_GAIN;
  const sp = G.speed;
  scrollZ += sp*dt;

  G.timeLeft -= dt;
  if(G.timeLeft<=0){ G.timeLeft=0; endRun('time'); return; }
  if(G.boost>0) G.boost = Math.max(0, G.boost-dt);

  // 角色横向平滑
  const target = laneX(G.lane);
  G.tLane = target;
  G.px = lerp(G.px, target, clamp(dt*13,0,1));
  G.tilt = lerp(G.tilt, 0, clamp(dt*7,0,1));   // 换道倾斜回正速度【待确认】

  // 道具推进 & 碰撞
  const playerZ = Z_P;
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.z -= sp*dt;
    if(it.z < Z_NEAR-0.6){ items.splice(i,1); continue; }
    if(it.dead) continue;
    // 碰撞：同一车道且 z 接近玩家
    if(it.lane===G.lane && Math.abs(it.z-playerZ)<0.42){
      const iy = gY(it.z);
      if(it.type==='coin'){
        it.dead = true;
        const add = COIN_SCORE*(G.boost>0?BOOST_MUL:1);
        G.score += add;
        sfx.coin();
        burst(it.lane, it.z, 'coin', add);
      } else if(it.type==='can'){
        it.dead = true;
        G.boost = BOOST_TIME;
        sfx.boost();
        burst(it.lane, it.z, 'can', 0);
      } else if(it.type==='cone'){
        sfx.crash();
        G.shake = 1;
        burst(it.lane, it.z, 'crash', 0);
        endRun('crash');
        return;
      }
    }
    if(it.z < Z_NEAR-0.5) items.splice(i,1);
  }

  // 补充道具
  let maxZ = Z_NEAR;
  items.forEach(it=>{ if(it.z>maxZ) maxZ=it.z; });
  while(maxZ < Z_FAR){
    const r = Math.random();
    if(r<0.60){
      const ln=rndi(0,2); const n=rndi(3,5);
      for(let k=0;k<n;k++) items.push({type:'coin',lane:ln,z:maxZ+1.1+k*1.15,dead:false});
      maxZ += n*1.15 + rnd(1.2,2.2);
    } else if(r<0.80){
      items.push({type:'cone',lane:rndi(0,2),z:maxZ+1.0,dead:false});
      maxZ += rnd(2.4,3.8);
    } else {
      items.push({type:'can',lane:rndi(0,2),z:maxZ+1.0,dead:false});
      maxZ += rnd(2.2,3.4);
    }
  }
  // 保证同 z 不出现三条道全是障碍
  const groups={};
  items.forEach(it=>{ const k=Math.round(it.z*0.8); (groups[k]=groups[k]||[]).push(it); });
  Object.keys(groups).forEach(k=>{
    const cs = groups[k].filter(o=>o.type==='cone');
    if(cs.length>=3) cs[2].type='coin';
  });
}

/* 倒计时阶段的道具推进（由 drawScene 统一驱动） */

function burst(lane, z, kind, amount){
  const y = gY(z), s = sZ(z), x = pX(laneX(lane), z);
  const n = kind==='coin'?10:(kind==='can'?18:22);
  for(let i=0;i<n;i++){
    const a = rnd(0,TAU), sp2 = rnd(60,240)*s;
    particles.push({
      x:x, y:y-40*s, vx:Math.cos(a)*sp2, vy:Math.sin(a)*sp2*0.6-90*s,
      g:520, life:rnd(0.35,0.75), max:0.75,
      r:rnd(3,8)*s, rot:rnd(0,TAU), vr:rnd(-8,8),
      col: kind==='coin'? (Math.random()<0.6?'#FFD24A':'#FFF3B0')
         : kind==='can'? (Math.random()<0.6?'#FFE066':'#FFFFFF')
         : (Math.random()<0.5?'#F5564A':'#FFFFFF'),
      star: kind==='can'
    });
  }
  if(kind==='coin'){
    // 分数飘字
    const cols = G.boost>0?'#FFE066':'#FFFFFF';
    particles.push({txt:'+'+amount, x:x, y:y-70*s, vx:0, vy:-130, g:0, life:0.85, max:0.85,
                    size:34*s+10, col:cols, isText:true, rot:0, vr:0});
  }
}

/* ==========================================================================
   14. 绘制：实体
   ========================================================================== */
function drawItems(){
  // 按 z 从远到近绘制
  const list = items.slice().sort((a,b)=>b.z-a.z);
  list.forEach(it=>{
    if(it.dead) return;
    const y = gY(it.z), s = sZ(it.z);
    if(y<GRASS_TOP-4) return;
    const x = pX(laneX(it.lane), it.z);
    const img = it.type==='coin'?COIN:(it.type==='cone'?CONE:CAN);
    const base = it.type==='coin'? 62 : (it.type==='cone'? 132 : 86);
    const w = base*s, h = img.height/img.width*w;
    const lift = it.type==='coin' ? 46*s : 0;
    if(y > H+80) return;
    ctx.drawImage(img, x-w/2, y-lift-h, w, h);
  });
}

function drawParticles(){
  particles.forEach(p=>{
    const a = clamp(p.life/p.max,0,1);
    ctx.save(); ctx.globalAlpha=a;
    if(p.isText){
      txt(ctx,p.txt,p.x,p.y,p.size,p.col,'900',{stroke:'rgba(45,45,65,0.9)',sw:6});
    } else if(p.star){
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.drawImage(FLARE,-p.r*2,-p.r*2,p.r*4,p.r*4);
    } else {
      ctx.fillStyle=p.col; circ(ctx,p.x,p.y,p.r*a+1); ctx.fill();
    }
    ctx.restore();
  });
}

function drawScene(dt){
  const spd = state===ST.PLAY? G.speed : 1.2;
  drawSky();

const ribbonPath=(c,x,y,w,h,th)=>{
  c.beginPath();
  c.moveTo(x-w/2,y);
  c.bezierCurveTo(x-w*0.32,y+h*0.30, x+w*0.32,y+h*0.30, x+w/2,y);
  c.lineTo(x+w/2-th,y-h*0.62);
  c.lineTo(x-w/2+th,y-h*0.62);
  c.closePath();
};
const notchedPath=(c,x,y,w,h,n)=>{
  c.beginPath();
  c.moveTo(x-w/2+n,y);
  c.lineTo(x+w/2-n,y);
  c.lineTo(x+w/2,y+h/2);
  c.lineTo(x+w/2-n,y+h);
  c.lineTo(x-w/2+n,y+h);
  c.lineTo(x-w/2,y+h/2);
  c.closePath();
};

/* ==========================================================================
   18. 渲染调度与主循环
   ========================================================================== */
const SCENE_STATES = [ST.PLAY, ST.PAUSE, ST.OVER, ST.RESULT, ST.RULES, ST.TUTOR, ST.COUNT];

function render(dt){
  hits.length = 0;
  ctx.save();
  if(G.shake>0){
    ctx.translate(rnd(-1,1)*7*G.shake, rnd(-1,1)*7*G.shake);
  }

  if(state===ST.LOAD){
    ctx.save(); ctx.translate(XOFF,0);
    drawLoading();
    ctx.restore();
  } else if(state===ST.START || state===ST.RANK || state===ST.PRIZE){
    ctx.save(); ctx.translate(XOFF,0);
    drawStartCover(stateT);
    ctx.restore();
    if(state===ST.RANK) { ctx.save(); ctx.translate(XOFF,0); drawRank(); ctx.restore(); }
    if(state===ST.PRIZE){ ctx.save(); ctx.translate(XOFF,0); drawPrize(); ctx.restore(); }
  } else if(SCENE_STATES.indexOf(state)>=0){
    // 世界层：铺满动态宽度（路面/道具/角色按 ROAD_CX 自动居中）
    drawScene(dt);
    // UI 层：按原 640 制版坐标绘制，整体居中
    ctx.save(); ctx.translate(XOFF,0);
    drawHUD();
    drawCtrlButtons();
    if(state===ST.COUNT) drawCountdown();
    if(state===ST.PAUSE) drawPause();
    if(state===ST.RULES) drawRules();
    if(state===ST.TUTOR) drawTutor();
    if(state===ST.OVER) drawOver();
    if(state===ST.RESULT) drawResult();
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(XOFF,0);
    drawStartCover(stateT);
    ctx.restore();
  }

  ctx.restore();
}

let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if(dt>0.05) dt = 0.05;          // 掉帧保护
  if(dt<0) dt = 0;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  if(s==='over' || s==='result'){
    G.score=1860; G.best=1860; G.timeLeft=6.4;
    G.rank=rankFor(1860); G.reward=rewardFor(1860);
  }
  if(s==='play'){ G.timeLeft=57; G.score=60; }   // 预览不加加速光环，便于与参考图比对
  if(map[s]!==undefined){ state = map[s]; stateT = 1.25; }
})();
